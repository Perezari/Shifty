<title>Shifty לאייפון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
<style>
/* The iPhone app's screens in the browser, on an iPhone 17 Pro of 402 by 874 points, scaled to fit:
   the page's controls on top, the device under them. Colors are the app's (Assets.xcassets) and iOS's. */
:root {
  /* the page around the device */
  --page: #E7ECEC;
  --page-ink: #11181A;
  --page-ink-2: #5C686C;
  --page-line: rgba(17, 24, 26, .10);
  --chip: rgba(255, 255, 255, .72);
  /* the app (Assets.xcassets: AccentColor, Background, Holiday) and iOS's system colors */
  --app-bg: #F4F5F7;
  --ink: #0B0F12;
  --ink-2: rgba(60, 60, 67, .62);
  --ink-3: rgba(60, 60, 67, .32);
  --accent: #0F9D8F;
  --accent-deep: #0B7D72;
  --accent-soft: rgba(15, 157, 143, .16);
  --orange: #FF9500;
  --red: #FF3B30;
  --green: #34C759;
  --amber: #B07D2A;
  --track: rgba(11, 15, 18, .06);
  --knob: #FFFFFF;
  --glass: rgba(255, 255, 255, .62);
  --glass-edge: rgba(255, 255, 255, .9);
  --glass-shade: rgba(20, 30, 35, .07);
  --activity: rgba(255, 255, 255, .88);
  --notif: rgba(246, 246, 248, .8);
  --menu: rgba(250, 250, 252, .82);
  --sep: rgba(60, 60, 67, .16);
  --cm-dim: rgba(0, 0, 0, .06);
  --seg-on: #FFFFFF;
  --font-text: -apple-system, "SF Pro Text", system-ui, "Rubik", "Segoe UI", sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Rubik", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #08090B; --page-ink: #EEF2F2; --page-ink-2: #98A3A6; --page-line: rgba(238, 242, 242, .12);
    --chip: rgba(40, 44, 48, .72);
    --app-bg: #15171C; --ink: #F5F7F8; --ink-2: rgba(235, 235, 245, .62); --ink-3: rgba(235, 235, 245, .3);
    --accent: #1BB3A3; --accent-deep: #148F83; --accent-soft: rgba(27, 179, 163, .2);
    --orange: #FF9F0A; --red: #FF453A; --green: #30D158; --amber: #D8A64E;
    --track: rgba(255, 255, 255, .07); --knob: #F5F7F8; --glass: rgba(44, 48, 54, .55); --glass-edge: rgba(255, 255, 255, .14);
    --glass-shade: rgba(0, 0, 0, .35); --activity: rgba(28, 28, 30, .88); --notif: rgba(36, 36, 40, .78);
    --menu: rgba(48, 48, 52, .8); --sep: rgba(235, 235, 245, .14); --cm-dim: rgba(0, 0, 0, .35); --seg-on: #636366;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #08090B; --page-ink: #EEF2F2; --page-ink-2: #98A3A6; --page-line: rgba(238, 242, 242, .12);
  --chip: rgba(40, 44, 48, .72);
  --app-bg: #15171C; --ink: #F5F7F8; --ink-2: rgba(235, 235, 245, .62); --ink-3: rgba(235, 235, 245, .3);
  --accent: #1BB3A3; --accent-deep: #148F83; --accent-soft: rgba(27, 179, 163, .2);
  --orange: #FF9F0A; --red: #FF453A; --green: #30D158; --amber: #D8A64E;
  --track: rgba(255, 255, 255, .07); --knob: #F5F7F8; --glass: rgba(44, 48, 54, .55); --glass-edge: rgba(255, 255, 255, .14);
  --glass-shade: rgba(0, 0, 0, .35); --activity: rgba(28, 28, 30, .88); --notif: rgba(36, 36, 40, .78);
  --menu: rgba(48, 48, 52, .8); --sep: rgba(235, 235, 245, .14); --cm-dim: rgba(0, 0, 0, .35); --seg-on: #636366;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--page-ink); font-family: var(--font-text); }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* the controls */
.bar { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 520px) { .row { flex-direction: column; align-items: center; } }
.seg { display: inline-flex; background: var(--page-line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; justify-content: center; }
.seg button { font: 500 13px/1 var(--font-text); color: var(--page-ink); background: transparent; border: 0;
  border-radius: 999px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { font-size: 12.5px; color: var(--page-ink-2); text-align: center; text-wrap: balance; max-width: 52ch; line-height: 1.5; margin: 0; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); margin-inline-end: 6px; }
.tag.built { background: var(--page-line); color: var(--page-ink-2); }

/* the device: 402 x 874 points, scaled by --s */
.stage { width: calc(402px * var(--s, 1)); height: calc(874px * var(--s, 1)); position: relative; }
.device { position: absolute; top: 0; left: 0; width: 402px; height: 874px; transform: scale(var(--s, 1)); transform-origin: top left;
  border-radius: 56px; overflow: hidden; background: var(--app-bg); color: var(--ink); font-family: var(--font-text);
  box-shadow: 0 0 0 11px #1b1d20, 0 0 0 12px #3a3d42, 0 30px 60px rgba(0, 0, 0, .25);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
@media (max-width: 460px) { .device { box-shadow: 0 0 0 1px var(--page-line); border-radius: 40px; } }
.num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* iOS's status bar, right to left: the time on the right */
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 34px 0 30px; z-index: 5; font: 600 17px/1 var(--font-text); }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 6; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 6; }

/* Liquid Glass */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 0.5px 0 var(--glass-edge), inset 0 0 0 0.5px var(--glass-edge), 0 6px 20px var(--glass-shade); }

/* ---- the Now screen: the shift on a clock's dial ---- */
.now { position: absolute; inset: 0; }
/* the screen scrolls; its parts follow one another closely, the first card under the buttons peeking under the tab bar */
.now-scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.now-scroll::-webkit-scrollbar { display: none; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 20px 120px; }
.topline { display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px; }
.topline .dot { width: 8px; height: 8px; border-radius: 50%; }
.topline .place { color: var(--ink-2); font-weight: 500; }

/* 350 points: the track of 12 hours at a radius of 160, 22 wide; the ticks inside it; the hours at 120 */
.dial { position: relative; width: 350px; height: 350px; flex: none; }
.dial .face, .dial .arc { position: absolute; inset: 4px; border-radius: 50%;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21.5px)); }
.dial .face { background: var(--track); }
.dial .tick { position: absolute; left: 50%; top: 30px; width: 1.5px; height: 4px; margin-left: -0.75px; border-radius: 1px;
  background: var(--ink-3); transform-origin: 50% 145px; }
.dial .tick.major { width: 2px; margin-left: -1px; height: 9px; background: var(--ink-2); }
.dial .hour { position: absolute; font: 600 13px/1 var(--font-round); color: var(--ink-3); transform: translate(-50%, -50%); }
.dial .mark { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
.dial .knob { width: 32px; height: 32px; background: var(--knob); box-shadow: 0 0 0 3.5px var(--k), 0 4px 14px rgba(0, 0, 0, .22); }
.dial .knob::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--k); }
.dial .start { width: 22px; height: 22px; background: var(--accent-deep); color: #fff; }
/* the flag of the goal: drawn along the dial to see the wage of leaving at another time */
.dial .goal { width: 30px; height: 30px; background: var(--knob); color: var(--f); cursor: grab; touch-action: none;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--f) 18%, transparent), 0 2px 8px rgba(0, 0, 0, .16); }
.dial .goal-dot { width: 10px; height: 10px; background: var(--knob); box-shadow: 0 0 0 2.5px var(--accent); }
/* the goal reached: the flag is a check (and on the iPhone the ring glows a moment, and it taps) */
.dial .goal.done { background: var(--accent); color: #fff; }
.dial .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.dial .date-in { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.dial .time { font-size: 58px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
.dial .earned { font-size: 23px; font-weight: 600; color: var(--accent); }
.dial .plan-pay { font-size: 44px; font-weight: 600; letter-spacing: -1px; line-height: 1; color: var(--accent); }
.dial .delta { font-size: 13.5px; font-weight: 600; }
.reset { border: 0; background: var(--track); color: var(--ink); font: 600 12.5px/1 var(--font-text); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* the three numbers on one card of glass */
.facts { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 14px 6px; border-radius: 24px; }
.facts div + div { border-inline-start: 1px solid var(--track); }
.facts b { display: block; font: 600 21px/1.2 var(--font-round); font-variant-numeric: tabular-nums; }
.facts span { font-size: 12.5px; color: var(--ink-2); }

.actions { width: 100%; display: flex; gap: 10px; }
/* the buttons with the cards' corners, 24 points */
.capsule { flex: 1; height: 56px; border-radius: 24px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 17px/1 var(--font-text); color: var(--ink); cursor: pointer; }
.capsule svg { width: 17px; height: 17px; }
.capsule.prominent { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 22px color-mix(in srgb, var(--accent) 32%, transparent); }
.square { flex: none; width: 56px; padding: 0; }
/* the shift's end held a second and a half until its button fills from its start, against a tap by mistake; let go before, it
   empties */
.capsule.hold { position: relative; overflow: hidden; touch-action: none; }
.capsule.hold .fill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--red); color: #fff; clip-path: inset(0 0 0 100%); transition: clip-path .25s ease-out; pointer-events: none; }
.capsule.hold.holding .fill { clip-path: inset(0); transition: clip-path 1.5s linear; }

.card { width: 100%; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-head .title { font-size: 16px; font-weight: 700; }
.card-head .meta { font-size: 13px; color: var(--ink-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .col { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.week .hrs { font: 600 11px/1 var(--font-round); color: var(--ink-2); height: 11px; }
.week .bar { width: 24px; height: 66px; border-radius: 8px; background: var(--track); position: relative; overflow: hidden; }
.week .bar i { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 8px; }
.week .bar.off { background: transparent; box-shadow: inset 0 0 0 1px var(--track); }
.week .day { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.week .today .day { color: var(--accent); }
.money-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.money-line > b { font: 700 30px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.money-line > span { font-size: 13px; color: var(--ink-2); }
.money-line > span b { font: 600 15px/1 var(--font-round); color: var(--ink); }
/* (proposed) the period's income and where it is heading on one line, each over its name, as the numbers under them */
.money { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 3px; }
.money > b { font: 600 17px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.money > b.big { font: 700 30px/1 var(--font-round); }
.money > span { font-size: 12px; color: var(--ink-2); }
.money > :nth-child(even) { text-align: end; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding-top: 4px; }
.mini div + div { border-inline-start: 1px solid var(--track); }
.mini b { display: block; font: 600 17px/1.3 var(--font-round); font-variant-numeric: tabular-nums; }
.mini span { font-size: 12px; color: var(--ink-2); }
.banner { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; }
.banner .ico { width: 36px; height: 36px; flex: none; border-radius: 11px; background: color-mix(in srgb, var(--amber) 18%, transparent);
  color: var(--amber); display: flex; align-items: center; justify-content: center; }
.banner b { display: block; font-size: 15px; }
.banner span { font-size: 13px; color: var(--ink-2); }
.idea { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 8px; align-self: flex-start; }

/* ---- the tab bar of iOS 26, over every tab: the chosen tab on a lens that slides to the next; scrolling down shrinks it
   to its tab (tabBarMinimizeBehavior(.onScrollDown)) ---- */
.chrome { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.chrome[hidden] { display: none; }
.chrome > * { pointer-events: auto; }
.tabs { position: absolute; bottom: 24px; left: 16px; right: 16px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px;
  transform-origin: right center; transition: transform .38s cubic-bezier(.3, 1.15, .4, 1), opacity .22s; }
.tabs .lens { position: absolute; top: 4px; bottom: 4px; right: 4px; width: calc((100% - 8px) / 4); border-radius: 28px; background: var(--track);
  transform: translateX(calc(var(--i, 0) * -100%)); transition: transform .48s cubic-bezier(.3, 1.3, .45, 1); }
.tabs .lens.moving { animation: lens .48s ease; }
@keyframes lens { 35% { scale: 1.16 .9; } }
.tabs .t { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 10.5px/1 var(--font-text); color: var(--ink); cursor: pointer; }
.tabs .t.on { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; overflow: visible; }
.tab-mini { position: absolute; bottom: 28px; right: 16px; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; display: flex;
  align-items: center; justify-content: center; color: var(--accent); cursor: pointer; opacity: 0; transform: scale(.5); pointer-events: none;
  transition: transform .38s cubic-bezier(.3, 1.2, .4, 1), opacity .2s; }
.tab-mini svg { width: 24px; height: 24px; }
/* the device's own class, not "mini": the period card's numbers are a .mini, whose rules would then reach every card */
.device.tabs-min .tabs { opacity: 0; transform: scale(.3, .8); pointer-events: none; }
.device.tabs-min .tab-mini { opacity: 1; transform: none; pointer-events: auto; }

/* ---- the Lock Screen and the home screen ---- */
.wall { position: absolute; inset: 0; background:
  radial-gradient(120% 70% at 80% 10%, #9CC9C3 0%, transparent 60%),
  radial-gradient(90% 60% at 10% 40%, #E7C7A2 0%, transparent 60%),
  radial-gradient(120% 80% at 50% 100%, #4F6F7A 0%, transparent 70%),
  linear-gradient(180deg, #CFE0DD, #6E8A93); }
.dark-wall { background:
  radial-gradient(120% 70% at 80% 10%, #1F4D49 0%, transparent 60%),
  radial-gradient(90% 60% at 10% 40%, #4A3A2B 0%, transparent 60%),
  radial-gradient(120% 80% at 50% 100%, #0C1418 0%, transparent 70%),
  linear-gradient(180deg, #1A2A2C, #05080A); }
.lock-date { position: absolute; top: 76px; width: 100%; text-align: center; color: rgba(255, 255, 255, .92); font-size: 19px; font-weight: 600; }
.lock-clock { position: absolute; top: 96px; width: 100%; text-align: center; color: rgba(255, 255, 255, .92); font-family: var(--font-round);
  font-size: 104px; font-weight: 600; letter-spacing: -2px; }
.lock-buttons { position: absolute; bottom: 44px; left: 46px; right: 46px; display: flex; justify-content: space-between; }
.lock-buttons div { width: 50px; height: 50px; border-radius: 50%; background: rgba(0, 0, 0, .28); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center; color: #fff; }
.activity { position: absolute; left: 12px; right: 12px; bottom: 120px; border-radius: 24px; padding: 16px 18px; background: var(--activity);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); color: var(--ink); display: flex; flex-direction: column; gap: 12px; }
.a-top { display: flex; align-items: center; gap: 12px; }
.a-left { flex: 1; min-width: 0; }
.a-head { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.a-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.a-head .place { font-weight: 400; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.a-clock { font-size: 44px; font-weight: 600; color: var(--accent); line-height: 1.1; }
.a-btns { display: flex; gap: 10px; }
.ri { border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; color: var(--tint); }
.ri::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--tint); opacity: .18; }
.ri svg { position: relative; }
.a-bar { height: 4px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; }
.a-bar i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 2px; background: var(--accent); }
.a-way { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: -6px; }

.di { position: absolute; left: 50%; transform: translateX(-50%); background: #000; color: #fff; }
.di-compact { top: 11px; height: 37px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 92px; }
.di-expanded { top: 11px; width: 378px; border-radius: 46px; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.di-row { display: flex; justify-content: space-between; align-items: center; }

.widgets { position: absolute; top: 78px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.w { border-radius: 24px; background: var(--app-bg); color: var(--ink); padding: 15px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); display: flex; flex-direction: column; }
.w-small { width: 170px; height: 170px; }
.w-medium { width: 364px; height: 170px; flex-direction: row; gap: 16px; align-items: center; }
.w-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.w-head .dot { width: 7px; height: 7px; border-radius: 50%; }
.w-clock { font-weight: 600; color: var(--accent); line-height: 1.1; }
.w-label { font-size: 12px; color: rgba(255, 255, 255, .9); text-align: center; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); }

/* notifications on the Lock Screen: the shift asked about on arriving and on leaving */
.notes { position: absolute; top: 236px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 10px; }
.notif { border-radius: 24px; padding: 13px 14px; background: var(--notif); -webkit-backdrop-filter: blur(30px) saturate(160%);
  backdrop-filter: blur(30px) saturate(160%); color: var(--ink); display: flex; gap: 11px; align-items: flex-start; }
.n-icon { width: 38px; height: 38px; flex: none; border-radius: 10px; background: linear-gradient(160deg, #1BB3A3, #0B7D72); color: #fff;
  display: flex; align-items: center; justify-content: center; }
.n-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.n-top { display: flex; justify-content: space-between; gap: 8px; }
.n-top b { font-size: 15px; }
.n-top span { font-size: 13px; color: var(--ink-2); }
.n-text { font-size: 15px; line-height: 1.3; }
.n-actions { border-radius: 18px; overflow: hidden; background: var(--notif); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
.n-actions div { padding: 14px 16px; font-size: 16px; color: var(--ink); }

/* the period's net pay: a row of its card, and line by line on a sheet */
.net-row { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; border-top: 1px solid var(--track); background: none;
  padding: 12px 0 0; font: 400 14.5px/1.2 var(--font-text); color: var(--ink-2); cursor: pointer; text-align: start; }
.net-row b { margin-inline-start: auto; font: 600 16px/1 var(--font-round); color: var(--accent); }
.net-row .chev { display: flex; color: var(--ink-3); }
.dim { position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0, 0, 0, .3); z-index: 7; cursor: pointer; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; border-radius: 38px 38px 0 0; padding: 10px 22px 44px;
  background: var(--app-bg); box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); display: flex; flex-direction: column; gap: 14px; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--ink-3); align-self: center; margin-bottom: 6px; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; }
.sheet-head b { font-size: 20px; }
.sheet-head span { font-size: 14px; color: var(--ink-2); }
.lines > div { display: flex; justify-content: space-between; padding: 8px 0; font-size: 16px; }
.lines > div > span:last-child { color: var(--ink-2); font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.lines > div:first-child > span:last-child { color: var(--ink); }
.net-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--track); padding-top: 14px; }
.net-total span { font-size: 17px; font-weight: 600; }
.net-total b { font: 700 30px/1 var(--font-round); color: var(--accent); }
.sheet p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
/* (proposed) what the employer saves for the worker, under the net */
.employer { display: flex; flex-direction: column; padding: 10px 14px; border-radius: 16px; background: var(--track); }
.employer > div { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; color: var(--ink-2); }
.employer > div:first-child { font-weight: 600; color: var(--ink); padding-bottom: 5px; }
.employer > div > span:last-child { font-family: var(--font-round); font-variant-numeric: tabular-nums; }
/* (proposed) the bonus accrued toward its payment */
.accrued { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.accrued i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
/* the vacation and sick days left */
.leave { display: grid; grid-template-columns: 1fr 1fr; }
.leave > div { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.leave > div + div { border-inline-start: 1px solid var(--track); }
.leave .li { width: 34px; height: 34px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; }
.leave b { display: block; font: 700 20px/1.1 var(--font-round); font-variant-numeric: tabular-nums; }
.leave span { font-size: 12px; color: var(--ink-2); }
/* Siri's answers, on glass over the Lock Screen */
.siri { border-radius: 26px; padding: 13px 15px; background: var(--notif); -webkit-backdrop-filter: blur(30px) saturate(160%);
  backdrop-filter: blur(30px) saturate(160%); color: var(--ink); display: flex; gap: 11px; align-items: flex-start;
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5), 0 0 22px rgba(120, 170, 255, .45); }
.siri .s-text { font-size: 15px; line-height: 1.35; }
.siri .s-app { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }
.mini-icon { width: 38px; height: 38px; flex: none; border-radius: 10px; overflow: hidden; display: block; }
.mini-icon svg, .icon-band .big svg { display: block; width: 100%; height: 100%; }
/* the home screen's icon, in its three looks */
.icon-rows { position: absolute; top: 70px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 14px; }
.icon-band { height: 222px; border-radius: 30px; position: relative; overflow: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; }
.icon-band .big { width: 84px; height: 84px; border-radius: 20px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); position: relative; }
.icon-band .name { font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .4); position: relative; }
.icon-band .look { position: absolute; top: 12px; inset-inline-start: 14px; font-size: 12px; font-weight: 600; color: #fff;
  background: rgba(0, 0, 0, .28); padding: 4px 10px; border-radius: 999px; }

/* ---- the Shifts, Calendar and Settings tabs, as built (Settings shortened) ---- */
.app { position: absolute; inset: 0; }
.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
/* iOS 26's soft edge at the top: what scrolls up fades under the status bar and the toolbar's buttons */
.edge { position: absolute; top: 0; left: 0; right: 0; height: 104px; z-index: 2; pointer-events: none;
  background: linear-gradient(var(--app-bg) 50%, color-mix(in srgb, var(--app-bg) 0%, transparent)); }
.navbar { position: absolute; top: 56px; left: 16px; right: 16px; height: 44px; display: flex; justify-content: flex-end; z-index: 3; pointer-events: none; }
.navbar > * { pointer-events: auto; }
.circle { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; }
.circle svg { width: 19px; height: 19px; }
.scr { display: flex; flex-direction: column; gap: 10px; padding: 102px 16px 130px; }
.large { margin: 0 4px 2px; font: 700 34px/1.15 var(--font-text); letter-spacing: -.4px; }
.pbar { display: flex; align-items: center; gap: 8px; }
.pbar .pb { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.pbar .pb svg { width: 17px; height: 17px; }
.pbar .pt { flex: 1; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 17px; font-weight: 600; }
.pbar .pt svg { width: 12px; height: 12px; color: var(--ink-2); }
.sum { display: grid; grid-template-columns: repeat(4, 1fr); padding: 14px 6px; margin-bottom: 6px; border-radius: 24px; color: #fff; text-align: center;
  background: color-mix(in srgb, var(--accent) 88%, transparent); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .45), 0 8px 22px color-mix(in srgb, var(--accent) 25%, transparent); }
.sum div + div { border-inline-start: 1px solid rgba(255, 255, 255, .22); }
.sum span { display: block; font-size: 11px; font-weight: 600; opacity: .85; }
.sum b { display: block; font: 700 17px/1.35 var(--font-round); font-variant-numeric: tabular-nums; }
.srow { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 24px; }
.badge { width: 44px; height: 46px; flex: none; border-radius: 12px; background: var(--track); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px; }
.badge b { font: 800 17px/1 var(--font-text); font-variant-numeric: tabular-nums; }
.badge small { font-size: 10px; font-weight: 600; }
.badge.short { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.badge.off { color: var(--ink-2); }
.sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sline { display: flex; align-items: baseline; gap: 8px; font-size: 17px; }
.sline > b { font-weight: 600; }
.spay { margin-inline-start: auto; font-weight: 600; white-space: nowrap; }
.smeta { font-size: 13px; color: var(--ink-2); }
.snote { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; align-self: center; }
.rtag.brk { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 12px; border-radius: 24px; }
.cal .wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-2); padding-bottom: 3px; }
.dc { min-height: 48px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 2px; }
.dc b { font: 500 15px/1 var(--font-text); font-variant-numeric: tabular-nums; }
.dc small { font: 600 10px/1 var(--font-round); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.sec-title { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 16px; }
.sec-card { border-radius: 24px; padding: 0 16px; }
.setrow { min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 17px; }
.setrow + .setrow { border-top: .5px solid var(--sep); }
.setrow .val { color: var(--ink-2); font-size: 16px; }

/* ---- a long press: the rest blurs, what was pressed lifts, and its menu opens, as iOS's context menus ---- */
.pressing { transform: scale(.965); transition: transform .45s ease-out; }
.cm { position: absolute; inset: 0; z-index: 20; }
.cm-dim { position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: var(--cm-dim);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: cm-fade .25s ease both; }
.cm-preview { position: absolute; animation: cm-pop .36s cubic-bezier(.3, 1.35, .5, 1) both; }
.cm-card { left: 16px; right: 16px; border-radius: 24px; padding: 16px; background: var(--app-bg); box-shadow: 0 14px 44px rgba(0, 0, 0, .2); }
.cm-src > * { width: 100% !important; height: 100% !important; margin: 0 !important; }
.cm-menu { position: absolute; min-width: 236px; max-width: 290px; border-radius: 22px; overflow: hidden; padding: 5px 0; background: var(--menu);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 14px 44px rgba(0, 0, 0, .2); animation: cm-menu .36s cubic-bezier(.3, 1.25, .45, 1) both; }
.cm-sec + .cm-sec::before { content: ""; display: block; height: 1px; margin: 5px 16px; background: var(--sep); }
.cm-head { padding: 8px 18px 3px; font-size: 13px; color: var(--ink-2); }
.cm-item { width: 100%; min-height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 9px 18px; font: 400 17px/1.2 var(--font-text); color: var(--ink); text-align: start; cursor: pointer; }
.cm-item:active { background: var(--track); }
.cm-item small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.cm-item svg { width: 19px; height: 19px; flex: none; }
.cm-item.red { color: var(--red); }
@keyframes cm-fade { from { opacity: 0; } }
@keyframes cm-pop { from { opacity: .6; transform: scale(.94); } }
@keyframes cm-menu { from { opacity: 0; transform: scale(.55); } }
/* the shift or the day, lifted: what its row has, and how it adds up */
.pv { display: flex; flex-direction: column; gap: 10px; }
.pv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pv-head b { font-size: 17px; }
.pv-head span { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.pv-lines > div { display: grid; grid-template-columns: 1fr auto 96px; gap: 10px; padding: 5px 0; font-size: 15px; }
.pv-lines > div > span:nth-child(2) { color: var(--ink-2); }
.pv-lines > div > span:last-child { text-align: end; }
.pv-note { font-size: 14px; color: var(--ink-2); background: var(--track); border-radius: 12px; padding: 8px 12px; }
.pv-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--track); padding-top: 12px; }
.pv-total span { font-weight: 600; }
.pv-total b { font: 700 22px/1 var(--font-round); color: var(--accent); }
.pv-empty { color: var(--ink-2); text-align: center; padding: 10px 0 4px; }

/* ---- (proposed) Shifty Pro, bought once: its sheet, its card at the top of Settings, and what it opens, marked Pro ---- */
.pro-badge { font: 700 11px/1 var(--font-text); color: var(--accent); background: var(--accent-soft); padding: 4px 8px; border-radius: 999px;
  letter-spacing: .02em; }
.net-row .pro-badge { margin-inline-start: auto; }
.pro-sheet { top: 58px; padding: 10px 22px 34px; gap: 18px; overflow-y: auto; scrollbar-width: none; }
.pro-sheet .x { position: absolute; top: 16px; inset-inline-start: 18px; width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0;
  display: flex; align-items: center; justify-content: center; color: var(--ink-2); background: var(--track); cursor: pointer; }
.pro-sheet .x svg { width: 15px; height: 15px; }
.pro-head { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-top: 10px; }
.pro-head .mini-icon { width: 72px; height: 72px; border-radius: 17px; margin-bottom: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.pro-head b { font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
.pro-head span { font-size: 15px; color: var(--ink-2); }
.pro-list { display: flex; flex-direction: column; gap: 15px; }
.pro-row { display: flex; gap: 13px; align-items: flex-start; }
.pro-row .ic { width: 36px; height: 36px; border-radius: 11px; flex: none; display: flex; align-items: center; justify-content: center;
  color: var(--accent); background: var(--accent-soft); }
.pro-row .ic svg { width: 19px; height: 19px; }
.pro-row b { display: block; font-size: 15.5px; margin-bottom: 2px; }
.pro-row span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.pro-buy { flex: none; width: 100%; }
.pro-note { margin-top: -8px; text-align: center; font-size: 12.5px; color: var(--ink-2); }
.pro-link { align-self: center; border: 0; background: none; padding: 4px 8px; color: var(--accent); font: 500 15px/1 var(--font-text); cursor: pointer; }
.pro-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 24px; }
.pro-card .top { display: flex; gap: 12px; align-items: center; }
.pro-card .mini-icon { width: 46px; height: 46px; border-radius: 11px; }
.pro-card b { display: block; font-size: 17px; }
.pro-card .top span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.pro-card .capsule { height: 48px; flex: none; width: 100%; font-size: 16px; }
.pro-card .pro-link { margin-top: -4px; }
.pro-on { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 24px; }
.pro-on .mini-icon { width: 40px; height: 40px; }
.pro-on b { font-size: 16px; }
.pro-on span { font-size: 13px; color: var(--ink-2); }
.pro-on .ok { margin-inline-start: auto; color: var(--accent); display: flex; }
.locked { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: start; font: inherit; color: inherit; cursor: pointer; }
.locked .sec-card .setrow { opacity: .42; }
.sec-title { display: flex; align-items: center; gap: 8px; }
.w-lock { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--ink-2);
  font-size: 13px; font-weight: 600; }
.w-lock svg { width: 26px; height: 26px; color: var(--accent); }

/* ---- (proposed) workplaces, as many as wanted, each with its pay from a date: by the hour, or global ---- */
.setrow.link, .setrow.add, .setrow.red { width: 100%; border: 0; background: none; padding: 0; font: inherit; color: inherit;
  text-align: start; cursor: pointer; }
.setrow + .setrow.link, .setrow + .setrow.add, .setrow + .setrow.red { border-top: .5px solid var(--sep); }
.setrow .wp, .setrow .when { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; }
.setrow .wp small, .setrow .when small { font-size: 13px; color: var(--ink-2); }
.setrow .chev { display: flex; color: var(--ink-3); margin-inline-start: auto; }
.setrow .now-tag { margin-inline-start: auto; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
  padding: 2px 7px; border-radius: 999px; }
.setrow .now-tag + .chev { margin-inline-start: 8px; }
.setrow.add { justify-content: flex-start; gap: 8px; color: var(--accent); }
.setrow.add svg { width: 18px; height: 18px; }
.setrow.add .pro-badge { margin-inline-start: auto; }
.setrow.red { justify-content: center; color: var(--red); }
.setrow.col { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; padding: 10px 0; }
.sec-note { margin: 0; padding: 0 16px; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.vchip { font: 500 16px/1 var(--font-text); font-variant-numeric: tabular-nums; padding: 7px 12px; border-radius: 999px; background: var(--track); }
.seg-in { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: 10px; background: var(--track); }
.setrow > .seg-in { flex: 1; }
.seg-in button { border: 0; background: none; border-radius: 8px; padding: 8px 0; font: 500 14px/1 var(--font-text); color: var(--ink); cursor: pointer; }
.seg-in button.on { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }
.sheet-bar { display: flex; align-items: center; justify-content: space-between; }
.sheet-bar b { font-size: 17px; }
.circle.prominent { background: var(--accent); color: #fff; }
.topline.pick { border: 0; color: inherit; font-family: inherit; cursor: pointer; }
.topline.pick > svg { width: 12px; height: 12px; color: var(--ink-2); }
.mini b small { font: 600 12px/1 var(--font-round); color: var(--ink-2); }
.dial .to-bonus { font-size: 13.5px; font-weight: 500; color: var(--ink-2); margin-top: -4px; }
.setrow.pick { width: 100%; border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: start; cursor: pointer; }
.setrow + .setrow.pick { border-top: .5px solid var(--sep); }
.setrow .tick { margin-inline-start: auto; display: flex; color: var(--accent); }
.pay-sheet { top: 58px; overflow-y: auto; scrollbar-width: none; }
.pay-sheet::-webkit-scrollbar { display: none; }
.sheet .sec-title { padding: 0 16px; margin-bottom: -6px; }
.smeta .wp-name { font-weight: 600; }

/* ---- (proposed) the first setup, at the first launch: a few short steps that fill the workplace, then the app ---- */
.wz { position: absolute; inset: 0; }
.wz-top { position: absolute; top: 56px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 3; }
.wz-top .circle { position: absolute; top: 0; inset-inline-start: 0; }
.wz-steps { display: flex; gap: 6px; }
.wz-steps i { width: 26px; height: 4px; border-radius: 2px; background: var(--track); }
.wz-steps i.on { background: var(--accent); }
.wz-body { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 118px 20px 160px; display: flex; flex-direction: column; gap: 12px; }
.wz-body::-webkit-scrollbar { display: none; }
.wz-title { margin: 0; font: 700 30px/1.15 var(--font-text); letter-spacing: -.4px; }
.wz-sub { margin: -4px 0 6px; font-size: 16px; color: var(--ink-2); line-height: 1.4; }
.wz-foot { position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 3; }
.wz-foot .capsule { flex: none; width: 100%; }
.wz .sec-note { padding: 0 4px; margin-top: -4px; }
.wz .sec-title { padding: 0 4px; margin: 6px 0 -4px; }
.field { font-size: 17px; }
/* the welcome, as Apple's own first screens: the icon, the name, and three things the app does */
.wz-hello { align-items: center; text-align: center; padding-top: 128px; gap: 10px; }
.wz-hello .mini-icon { width: 92px; height: 92px; border-radius: 21px; box-shadow: 0 8px 22px rgba(0, 0, 0, .18); margin-bottom: 10px; }
.wz-feats { align-self: stretch; display: flex; flex-direction: column; gap: 22px; margin-top: 24px; padding: 0 8px; text-align: start; }
.wz-feats > div { display: flex; gap: 16px; align-items: flex-start; }
.wz-feats svg { width: 30px; height: 30px; flex: none; color: var(--accent); }
.wz-feats b { display: block; font-size: 16px; margin-bottom: 2px; }
.wz-feats span { font-size: 14px; color: var(--ink-2); line-height: 1.35; }
/* the days of the week, each a circle, as the Clock's alarms */
.daychips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 14px 0; }
.daychips span { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;
  background: var(--track); }
.daychips span.on { background: var(--accent); color: #fff; }
.wz-done { align-items: center; text-align: center; padding-top: 150px; }
.wz-done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.wz-done .sec-card { align-self: stretch; text-align: start; margin-top: 14px; }

/* (proposed) arrived before the shift's start, as the place's reminder saw it: a tip, as TipKit draws one, offering that time */
.tip { width: 100%; border-radius: 24px; padding: 14px 16px 0; display: flex; flex-direction: column; position: relative; }

<script>
(() => {
  "use strict";

  // ---- made-up data, as Demo.swift's: the repository is public, and the preview shows no one's real hours or wages ----
  const WAGE = 54, GOAL_H = 8.1, AUTO_BREAK_MIN = 30, PLACE = "סטודיו גל", CUR = "₪";
  const loaded = Date.now();
  const at = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
  // each state as a moment of today's shift, from 07:15; the moment runs on from when the page opened
  const START = at(7, 15);
  // (proposed) the place's reminder saw the arrival at work 13 minutes before the shift's start
  const ARRIVED = at(7, 2);
  const scenes = {
    work: { now: START + ((5 * 60 + 17) * 60 + 13) * 1000, breaks: [[150, 25]] },                     // 5:17 in, after a break of 25 minutes
    over: { now: START + ((9 * 60 + 12) * 60 + 5) * 1000, breaks: [[150, 25]] },                      // past the goal, overtime
    break: { now: START + ((3 * 60 + 4) * 60 + 40) * 1000, breaks: [[0, null]], breakFor: 6 * 60 + 12 }, // on a break for 6:12
    idle: { now: at(17, 5), today: [[at(7, 15), at(11, 0)], [at(11, 30), at(15, 15)]] },               // after a shift of 7:30
  };
  const TABS = ["now", "shifts", "calendar", "settings"];
  // pay: the main workplace's pay now, "hourly" or "global"; places: one workplace or two; next: where the next shift is;
  // page: a workplace's page open in Settings
  // cover: what a global pay does with overtime ("all", "upTo", "none", or "tiers": a bonus at each target)
  // autoBreak: the main workplace takes an automatic break, so no break button is shown
  // (proposed) step: the first setup's step; hebrew: the Hebrew date shown; fromDay: the setup's pay period, from the 1st or the 20th;
  // tip: the arrival's tip not yet taken or closed; early: the minutes the start moved back by taking it
  const state = { screen: "now", state: "work", theme: null, tab: "now", pro: false, pay: "hourly", places: 1, next: 0, cover: "tiers", autoBreak: true,
    plan: null, sheet: null, page: null, step: 0, hebrew: true, fromDay: 1, tip: true, early: 0 };
  try { Object.assign(state, JSON.parse(localStorage.getItem("shifty-preview") || "{}")); } catch (e) {}
  state.plan = null;
  state.sheet = null;
  state.page = null;
  state.tip = true;
  state.early = 0;
  if (!scenes[state.state]) state.state = "work";
  if (!TABS.includes(state.tab)) state.tab = "now";

  // ---- Format (Shifty/Core/Format.swift) ----
  const pad = (n) => String(n).padStart(2, "0");
  const clock = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const timer = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s); };
  const hm = (hours) => { const t = Math.round(Math.max(0, hours) * 60); return Math.floor(t / 60) + ":" + pad(t % 60); };
  const money = (v) => CUR + " " + v.toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const moneyShort = (v) => CUR + " " + Math.round(v).toLocaleString("he-IL");
  const days = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
  const months = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
  const dayLine = (d) => "יום " + days[d.getDay()] + ", " + d.getDate() + " ב" + months[d.getMonth()];
  /** (proposed) A number in Hebrew letters, as a Hebrew date writes it: 23 "כ״ג", 15 "ט״ו", 787 "תשפ״ז". */
  const gematria = (n) => {
    const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"], tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
    const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
    const s = (hundreds[Math.floor(n / 100)] + tens[Math.floor(n % 100 / 10)] + ones[n % 10]).replace(/יה$/, "טו").replace(/יו$/, "טז");
    return s.length === 1 ? s + "׳" : s.slice(0, -1) + "״" + s.slice(-1);
  };
  const hebrewParts = new Intl.DateTimeFormat("he-IL-u-ca-hebrew", { day: "numeric", month: "long", year: "numeric" });
  /** (proposed) The Hebrew date of `d`: its day "כ״ג", month "חשוון" and year "תשפ״ז". */
  const hebrew = (d) => {
    const p = Object.fromEntries(hebrewParts.formatToParts(d).map((x) => [x.type, x.value]));
    const day = parseInt(p.day, 10), year = parseInt(p.year, 10);
    return { day: isNaN(day) ? p.day : gematria(day), month: p.month, year: isNaN(year) ? p.year : gematria(year % 1000) };
  };
  /** "כ״ג בחשוון". */
  const hebrewDay = (d) => { const h = hebrew(d); return h.day + " ב" + h.month; };

  /** The wage of a day of `net` hours: its standard at the wage, then 125% for two hours and 150% after (Calc.breakdown). */
  const payFor = (net) => (Math.min(net, GOAL_H) + Math.min(Math.max(0, net - GOAL_H), 2) * 1.25 + Math.max(0, net - GOAL_H - 2) * 1.5) * WAGE;
  /** The net hours of the shift if it ends at `end`: its breaks, or the automatic break once it is six hours long. */
  const autoBreakMs = () => state.autoBreak ? AUTO_BREAK_MIN * 60000 : 0;
  const netAt = (start, breakMs, end) => {
    const gross = end - start;
    return Math.max(0, gross - (gross >= 6 * 3600000 ? Math.max(breakMs, autoBreakMs()) : breakMs)) / 3600000;
  };

  // ---- the net pay, as Net.swift gives it at 2026's rates: the period heading to ₪ 8,640, ₪ 8,200 of it pensionable ----
  const BRACKETS = [[7010, .10], [10060, .14], [19000, .20], [25100, .31], [46690, .35], [60130, .47], [Infinity, .50]];
  /** (proposed) The study fund is saved from a wage up to ₪ 15,712 a month (2026's ceiling, free of tax). */
  const STUDY_CEILING = 15712;
  function netPay(gross, pensionable, points = 2.25, pensionPct = 6, studyPct = 2.5) {
    const pension = pensionable * pensionPct / 100, studyFund = Math.min(pensionable, STUDY_CEILING) * studyPct / 100;
    let tax = 0, floor = 0;
    for (const [top, rate] of BRACKETS) { if (gross > floor) tax += (Math.min(gross, top) - floor) * rate; floor = top; }
    const credit = points * 242 + 0.35 * Math.min(pension, 0.07 * Math.min(pensionable, 9700));
    const insured = Math.min(gross, 51910), reduced = Math.min(insured, 7703), full = insured - reduced;
    const p = { gross, incomeTax: Math.max(0, tax - credit), insurance: reduced * .0104 + full * .07, health: reduced * .0323 + full * .0517, pension,
      studyFund };
    p.net = gross - p.incomeTax - p.insurance - p.health - p.pension - p.studyFund;
    // (proposed) what the employer saves besides: 6.5% for the pension, 8.33% for severance, 7.5% for the study fund
    p.employer = { pension: pensionable * .065, severance: pensionable * .0833, studyFund: Math.min(pensionable, STUDY_CEILING) * .075 };
    return p;
  }
  const NET = netPay(8640, 8200);

  // ---- (proposed) workplaces, each with its pay from a date: the main one by the hour since January or, from the first of
  //      this month, global; a second one by the hour, on Fridays. Made up, as the rest ----
  const SALARY = 12000, OT_IN = 30, HOUR_VALUE = SALARY / 182, MONTH_OT = 6.5, MONTH_HOURS = 118.5, BONUS = 5000;
  /** (proposed) A global pay's bonus at each target of overtime hours a month: each reached adds its amount, and hours short of
   *  the first are not paid. */
  const TIERS = [[20, 1500], [40, 1500]];
  /** What a global pay does with overtime: the choices of its sheet, each with its line. */
  const COVERS = [
    ["all", "כלולות בשכר", "השכר מכסה את כל השעות הנוספות."],
    ["upTo", "כלולות עד מספר שעות", "שעות מעבר לכך משולמות לפי ערך שעה."],
    ["none", "משולמות כולן", "כל שעה נוספת משולמת לפי ערך שעה."],
    ["tiers", "בונוס ביעד", "סכום קבוע כשמגיעים למספר שעות בחודש. שעות שלא הגיעו ליעד לא משולמות."],
  ];
  /** The next target not reached at `hours`, as [hours, amount]; null past the last. */
  const nextTier = (hours) => TIERS.find(([h]) => hours < h) || null;
  /** "בונוס ב־20 וב־40 שעות", "עד 30 שעות בחודש": what the pay does with overtime, in a row. */
  const coverText = () => ({ all: "כלולות בשכר", upTo: `עד ${OT_IN} שעות בחודש`, none: "משולמות כולן",
    tiers: `בונוס ב־${TIERS.map(([h]) => h).join(" וב־")} שעות` })[state.cover];
  const SECOND = { name: "קפה אגם", wage: 42, start: 10 };
  const isGlobal = () => state.pay === "global";
  const NET_GLOBAL = netPay(SALARY, SALARY);
  const netNow = () => isGlobal() ? NET_GLOBAL : NET;
  /** "1 בנובמבר 2026": the first of this month, when the global pay begins. */
  const firstOfMonth = () => { const d = new Date(); return "1 ב" + months[d.getMonth()] + " " + d.getFullYear(); };
  /** The period's income: its shifts', and a global pay's month. */
  const income = (t) => t.total + (isGlobal() ? SALARY : 0);
  /** "6 שעות ו־42 דקות", as Siri says it (Questions.swift). */
  const spoken = (hours) => {
    const t = Math.max(0, Math.round(hours * 60)), h = Math.floor(t / 60), m = t % 60;
    const ht = h === 1 ? "שעה" : h === 2 ? "שעתיים" : h + " שעות", mt = m === 1 ? "דקה" : m + " דקות";
    return h === 0 ? mt : m === 0 ? ht : ht + " ו־" + mt;
  };

  // ---- the shift at this moment, as Calc.nowStatus gives it ----
  function shift() {
    const scene = scenes[state.state], elapsed = (Date.now() - loaded) / 1000;
    const now = scene.now + elapsed * 1000;
    if (!scene.breaks) return { now, running: false, today: scene.today };
    const start = START - state.early * 60000;
    let breakMs = 0, open = null; const breaks = [];
    for (const [after, minutes] of scene.breaks) {
      // with an automatic break, none is logged: there is no button for it
      if (minutes != null && state.autoBreak) continue;
      if (minutes == null) { const since = now - (scene.breakFor + elapsed) * 1000; open = since; breaks.push([since, now]); breakMs += now - since; }
      else { const bs = start + after * 60000; breaks.push([bs, bs + minutes * 60000]); breakMs += minutes * 60000; }
    }
    const net = netAt(start, breakMs, now), pay = payFor(net);
    const finish = start + GOAL_H * 3600000 + Math.max(breakMs, autoBreakMs());
    return { now, running: true, start, breaks, breakMs, open, netMs: net * 3600000, net, pay, overtime: Math.max(0, net - GOAL_H),
      remaining: GOAL_H - net, finish, projected: net > 0.001 ? pay * (GOAL_H / net) : 0 };
  }

  /** Leaving at `end`: the shift's net hours and wage then, against the goal's. */
  function planAt(s, end) {
    const net = netAt(s.start, s.breakMs, end), pay = payFor(net);
    return { end, net, pay, extra: net - GOAL_H, extraPay: pay - payFor(GOAL_H) };
  }

  // ---- icons, as the SF Symbols the app uses ----
  const icon = {
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
    // list.bullet as iOS draws it right to left
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><g class="l"><path d="M4 6h11"/><circle cx="19.5" cy="6" r="1.2" fill="currentColor"/></g><g class="l"><path d="M4 12h11"/><circle cx="19.5" cy="12" r="1.2" fill="currentColor"/></g><g class="l"><path d="M4 18h11"/><circle cx="19.5" cy="18" r="1.2" fill="currentColor"/></g></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    flag: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 3h2v18H6z"/><path d="M8 4h10l-2.5 4L18 12H8z"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    flash: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 2h8l-2 6h-4zM10 8h4v13h-4z"/></svg>',
    camera: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    cross: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5"/><rect x="3" y="7.5" width="18" height="12.5" rx="2.5" fill="currentColor"/><path fill="#fff" d="M11 10.6h2v2.3h2.3v2H13v2.3h-2v-2.3H8.7v-2H11z"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',

  // ---- the dial: twelve hours as an analog clock, the shift on it from its start to the day's goal ----
  const C = 175, R = 160;
  const clockDeg = (t) => { const d = new Date(t); return ((d.getHours() % 12) + d.getMinutes() / 60 + d.getSeconds() / 3600) * 30; };
  const spanDeg = (ms) => Math.min(360, Math.max(0, ms / 3600000 * 30));
  const point = (deg, r) => { const a = deg * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; };
  /** One conic gradient of the arc's pieces, each [from, to, color] in degrees from the start, in order. */
  const arc = (fromDeg, pieces) => {
    const stops = pieces.filter(([a, b]) => b > a).map(([a, b, c]) => `${c} ${a.toFixed(2)}deg ${b.toFixed(2)}deg`);
    const last = pieces.length ? Math.max(...pieces.map((p) => p[1])) : 0;
    return `conic-gradient(from ${fromDeg.toFixed(2)}deg, ${stops.join(", ")}${stops.length ? ", " : ""}transparent ${last.toFixed(2)}deg 360deg)`;
  };
  const face = () => {
    let ticks = "";
    for (let i = 0; i < 60; i++) ticks += `<i class="tick${i % 5 === 0 ? " major" : ""}" style="transform:rotate(${i * 6}deg)"></i>`;
    const hours = [[12, 0], [3, 90], [6, 180], [9, 270]].map(([h, deg]) => { const [x, y] = point(deg, 120); return `<span class="hour" style="left:${x}px;top:${y}px">${h}</span>`; }).join("");
    return `<div class="face"></div>${ticks}${hours}`;
  };

  function dial(s, center, plan) {
    let pieces = [], from = 0, marks = "";
    if (s.running) {
      from = clockDeg(s.start);
      const rel = (t) => spanDeg(t - s.start);
      const goal = rel(s.finish), now = rel(s.now);
      // the work, the breaks in orange, past the goal in amber
      let cursor = s.start;
      const work = (a, b) => {
        if (b <= a) return;
        if (b <= goal) pieces.push([a, b, "var(--accent)"]);
        else if (a >= goal) pieces.push([a, b, "var(--amber)"]);
        else { pieces.push([a, goal, "var(--accent)"]); pieces.push([goal, b, "var(--amber)"]); }
      };
      for (const [bs, be] of s.breaks) { work(rel(cursor), rel(bs)); pieces.push([rel(bs), rel(Math.min(be, s.now)), "var(--orange)"]); cursor = be; }
      if (cursor < s.now) work(rel(cursor), now);
      // ahead: to the goal in the accent's shade; with a plan, to the time chosen, past the goal in amber's, short of it in red's
      const leave = plan ? Math.max(now, rel(plan.end)) : goal;
      if (leave <= goal) {
        pieces.push([now, leave, "var(--accent-soft)"]);
        if (plan) pieces.push([leave, goal, "color-mix(in srgb, var(--red) 22%, transparent)"]);
      } else {
        pieces.push([now, goal, "var(--accent-soft)"]);
        pieces.push([Math.max(now, goal), leave, "color-mix(in srgb, var(--amber) 38%, transparent)"]);
      }
      const [sx, sy] = point(from, R), [fx, fy] = point(from + leave, R), [gx, gy] = point(from + goal, R), [nx, ny] = point(from + now, R);
      const knob = s.open != null ? "var(--orange)" : now > goal ? "var(--amber)" : "var(--accent)";
      const flagColor = plan ? (plan.extra >= 0 ? "var(--amber)" : "var(--red)") : "var(--accent)";
      const done = !plan && now >= goal;
      marks = `<span class="mark start" style="left:${sx}px;top:${sy}px">${sized(icon.play, 10)}</span>
        ${plan ? `<span class="mark goal-dot" style="left:${gx}px;top:${gy}px"></span>` : ""}
        <span class="mark knob" style="left:${nx}px;top:${ny}px;--k:${knob}"></span>
        <span class="mark goal${done ? " done" : ""}" style="left:${fx}px;top:${fy}px;--f:${flagColor}" aria-label="גרירה לבחירת שעת יציאה">${done ? icon.check : icon.flag}</span>`;
    } else if (s.today) {
      // a day with no shift running: today's shifts, faint, and the time now
      from = clockDeg(s.today[0][0]);
      const rel = (t) => spanDeg(t - s.today[0][0]);
      for (const [a, b] of s.today) pieces.push([rel(a), rel(b), "color-mix(in srgb, var(--accent) 45%, transparent)"]);
      const [nx, ny] = point(clockDeg(s.now), R);
      marks = `<span class="mark knob" style="left:${nx}px;top:${ny}px;--k:var(--ink-3)"></span>`;
    }
    return `<div class="dial">${face()}<div class="arc" style="background:${arc(from, pieces)}"></div>${marks}<div class="center">${center}</div></div>`;
  }

      // the icon and the word in the button's color, on glass; the end held until its button fills, a tap opening what a long

      const endButton = `<button class="capsule glass hold" type="button" data-hold="end" data-menu="act:end" data-tap-menu style="color:var(--red)">${icon.stop}סיום משמרת<span class="fill" aria-hidden="true">${icon.stop}סיום משמרת</span></button>`;

  /** (proposed) The arrival at work, 5 minutes or more before the shift's start: a tip offering to start the shift then. */
  function arrivalTip(s) {
    const minutes = Math.round((s.start - ARRIVED) / 60000);

  // ---- ideas under the buttons, for the user to choose from ----
  /** The week, Sunday on the right: each day's hours against its standard, today's as it grows. */
  function weekCard(s) {
    const std = [9.1, 9.1, 9.1, 9.1, 8.1, null, null], past = [9.33, 9.68, 8.92, 9.2];
    const todayHours = s.running ? s.net : 7.5;

    const cols = std.map((goal, i) => {
      const hours = i < 4 ? past[i] : i === 4 ? todayHours : null;
      if (hours != null) { total += hours; if (goal && i < 4 && hours < goal) missing += goal - hours; }
      const share = goal && hours != null ? Math.min(1, hours / goal) : 0;

    const target = !isGlobal() ? null : state.cover === "upTo" ? OT_IN : state.cover === "tiers" ? (nextTier(MONTH_OT) || [null])[0] : null;

  // ---- the pay period's shifts, for the Shifts and Calendar tabs: made up, Sunday to Thursday from the 1st, and today's
  //      as the state above has it ----
  /** The wage of `net` hours on a day of `std`: 125% for two hours past it, 150% after. */
  const dayPay = (net, std) => (Math.min(net, std) + Math.min(Math.max(0, net - std), 2) * 1.25 + Math.max(0, net - std - 2) * 1.5) * WAGE;
  const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  /** The month the Shifts and Calendar tabs show: this one, or in its first week the one before, which has days to show. */
  const periodStart = () => { const t = midnight(); return new Date(t.getFullYear(), t.getMonth() - (t.getDate() < 8 ? 1 : 0), 1); };
  /** Days of reserve duty, the 13th to the 17th of the month shown, Friday and Shabbat too: each marked as a sick day is, for the
   *  record, without pay of its own (Bituach Leumi's pay changes every year, and is not counted). */
  const RESERVE = { from: 13, to: 17 };
  /** The period's shifts and days off, the newest first: back from yesterday (or the month's last day), thirteen shifts with a
   *  sick day and three days of vacation among them (with today's, the Now screen's fourteen), and none on the days before. With
   *  two workplaces, the second's Fridays too. A global pay's shifts earn nothing each (`hourly` false): the month's pay is the
   *  period's. (proposed) And five days of reserve duty. */
  function periodShifts(s) {
    const today = midnight(), first = periodStart(), list = [];
    const hourly = !isGlobal(), place = state.places === 2 ? PLACE : "";
    // the month shown, to its last day: in the first week of the next one, not its days
    const end = new Date(Math.min(+today, +new Date(first.getFullYear(), first.getMonth() + 1, 1)));
    for (let d = new Date(end), n = 0, worked = 0; worked < 13;) {
      d.setDate(d.getDate() - 1);
      if (d < first) break;
      if (d.getDate() >= RESERVE.from && d.getDate() <= RESERVE.to) {
        list.push({ day: new Date(d), type: "reserve", start: +d, net: 0, pay: 0, hourly, place });
        continue;
      }
      if (d.getDay() === 5 && state.places === 2) {
        const start = new Date(d);
        start.setHours(8, 0, 0, 0);
        list.push({ day: new Date(d), type: "work", start: +start, end: +start + 5.5 * 3600000, breakMin: 0, net: 5.5, pay: 5.5 * SECOND.wage,
          std: 5.5, wage: SECOND.wage, overtime: 0, hourly: true, place: SECOND.name });
        continue;
      }
      if (d.getDay() > 4) continue;
      n++;
      const day = new Date(d), std = day.getDay() === 4 ? 8.1 : 9.1;
      const r = (k) => { const x = Math.sin(day.getDate() * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
      if (n === 4) { list.push({ day, type: "sick", start: +day, net: std, pay: 0, std, hourly, place }); continue; }
      if (n >= 9 && n <= 11) { list.push({ day, type: "vacation", start: +day, net: std, pay: hourly ? std * WAGE : 0, std, hourly, place }); continue; }
      worked++;
      const start = new Date(day);
      start.setHours(7, Math.floor(r(1) * 9) * 5, 0, 0);
      const gross = Math.round((std + 0.5 + (r(2) - 0.2) * 1.4) * 12) / 12;
      const net = gross - 0.5;
      list.push({ day, type: "work", start: +start, end: +start + gross * 3600000, breakMin: 30, net, pay: hourly ? dayPay(net, std) : 0, std,
        overtime: Math.max(0, net - std), short: net < std - 0.01, note: n === 6 ? "ישיבת צוות" : n === 14 ? "ספירת מלאי" : "", hourly, place });
    }
    if (first.getMonth() !== today.getMonth()) {
      // the month before: today is not in it
    } else if (s.running) {
      list.push({ day: today, type: "work", start: s.start, end: null, breakMin: Math.round(s.breakMs / 60000), net: s.net, pay: hourly ? s.pay : 0,
        std: GOAL_H, overtime: s.overtime, running: true, onBreak: s.open != null, hourly, place });
    } else {
      for (const [a, b] of s.today) {
        const net = (b - a) / 3600000;
        list.push({ day: today, type: "work", start: a, end: b, breakMin: 0, net, pay: hourly ? net * WAGE : 0, std: GOAL_H, overtime: 0, hourly, place });
      }
    }
    return list.sort((a, b) => b.start - a.start);
  }
  /** The period's hours, hours missing, shifts, days worked and income. */
  function totals(list) {
    const t = { hours: 0, missing: 0, count: 0, total: 0, days: new Set() };
    for (const e of list) {
      t.total += e.pay;
      if (e.type !== "work") continue;
      t.count++;
      t.hours += e.net;
      t.days.add(e.day.getDate());
      if (e.short) t.missing += e.std - e.net;
    }
    return t;
  }
  /** The period's days by their number: their shifts or day off, hours and pay. */
  function byDay(list) {
    const map = new Map();
    for (const e of list) {
      const k = e.day.getDate(), d = map.get(k) || { entries: [], net: 0, pay: 0, short: false, off: null };
      d.entries.unshift(e);
      d.pay += e.pay;
      if (e.type === "work") { d.net += e.net; d.short = d.short || !!e.short; } else d.off = e.type;
      map.set(k, d);
    }
    return map;
  }

  const summary = (cells) => `<div class="sum">${cells.map(([t, v]) => `<div><span>${t}</span><b><span class="ltr">${v}</span></b></div>`).join("")}</div>`;
  /** The period between the earlier one, on the right, and the later; (proposed) on the Calendar, its Hebrew months under it. */
  const periodBar = (withHebrew) => { const d = periodStart(), title = `${months[d.getMonth()]} ${d.getFullYear()}${icon.down}`;
    if (!withHebrew) return `<div class="pbar"><span class="pb">${icon.back}</span><span class="pt">${title}</span><span class="pb">${icon.chevron}</span></div>`;
    const a = hebrew(d), b = hebrew(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    const months2 = a.month === b.month ? `${a.month} ${a.year}` : a.year === b.year ? `${a.month}–${b.month} ${b.year}` : `${a.month} ${a.year}–${b.month} ${b.year}`;
    return `<div class="pbar"><span class="pb">${icon.back}</span><span class="pt two"><span class="pt-row">${title}</span><small>${months2}</small></span><span class="pb">${icon.chevron}</span></div>`; };
  const range = (e) => `${clock(new Date(e.start))} – ${clock(new Date(e.end))}`;

  /** A shift's row (Components.swift ShiftRow): its day, its hours or the kind of day off, its pay, and how its hours add up. A
   *  global pay's shift has its hours where the pay was; with two workplaces, each row names its own. */
  function shiftRow(e, i) {
    const off = e.type !== "work", byHours = e.hourly === false, reserve = e.type === "reserve";
    const time = e.type === "vacation" ? "חופשה בתשלום" : e.type === "sick" ? "יום מחלה" : reserve ? "יום מילואים"
      : e.end == null ? `התחלה <span class="num">${clock(new Date(e.start))}</span>` : `<span class="num">${range(e)}</span>`;
    const tag = e.running ? `<span class="rtag${e.onBreak ? " brk" : ""}">${e.onBreak ? "בהפסקה" : "פעילה"}</span>` : "";
    const where = e.place ? `<span class="wp-name">${e.place}</span>` : "";
    // (proposed) a day of reserve duty, for the record: its pay is not counted, a global pay's month going on
    const meta = e.type === "vacation" ? [where, `${hm(e.net)} שע׳ בתשלום`].filter(Boolean).join(" · ") : e.type === "sick" ? "יום 1 · 0% מהתקן"
      : reserve ? (byHours ? "המשכורת ממשיכה" : "התגמול לא נכלל בחישוב")
      : [where, byHours ? "" : hm(e.net) + " שע׳", e.breakMin ? `הפסקה ${e.breakMin}׳` : "", e.overtime > 0.01 ? "נ.ש " + hm(e.overtime) : ""]
        .filter(Boolean).join(" · ");
    return `<div class="srow glass" data-menu="shift:${i}">
      <span class="badge${e.short ? " short" : ""}${off ? " off" : ""}"><b>${e.day.getDate()}</b><small>${days[e.day.getDay()].replace("׳", "")}</small></span>
      <div class="sbody"><div class="sline"><b>${time}</b>${tag}<span class="spay num"><span class="ltr">${reserve ? "" : byHours ? hm(e.net) : money(e.pay)}</span></span></div>
        <div class="smeta num">${meta}</div>${e.note ? `<div class="snote">${e.note}</div>` : ""}</div></div>`;
  }

  // ---- the Shifts tab (ShiftsView.swift): the period's numbers and its shifts ----
  function shiftsScreen() {
    const s = shift(), list = periodShifts(s), t = totals(list);
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="navbar"><button class="circle glass" type="button" data-menu="plus" aria-label="הוספת משמרת">${icon.plus}</button></div>

        ${list.map(shiftRow).join("")}</div></div><div class="home-ind"></div></div>`;
  }

  // ---- the Calendar tab (CalendarView.swift): each day worked filled by its hours against its standard, red when short ----
  function calendarScreen() {
    const s = shift(), list = periodShifts(s), sums = byDay(list), t = totals(list), today = midnight();
    const first = periodStart(), last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    let cells = days.map((d) => `<span class="wd">${d.replace("׳", "")}</span>`).join("");
    for (let d = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay()); d <= last || d.getDay() !== 0; d.setDate(d.getDate() + 1)) {
      const inside = d >= first && d <= last, sum = inside ? sums.get(d.getDate()) : null, isToday = +d === +today;
      const worked = sum && sum.net > 0;
      const fill = !inside ? "transparent" : worked ? (sum.short ? "color-mix(in srgb, var(--red) 13%, transparent)"
          : `color-mix(in srgb, var(--accent) ${Math.round((0.09 + Math.min(1, sum.net / (d.getDay() === 4 ? 8.1 : 9.1)) * 0.17) * 100)}%, transparent)`)
        : sum && sum.off ? "color-mix(in srgb, var(--ink) 9%, transparent)" : "var(--track)";
      const color = sum && sum.short ? "var(--red)" : worked || isToday ? "var(--accent)" : "var(--ink)";
      const weight = isToday ? 800 : worked ? 700 : 500;
      const under = worked ? `<small style="${sum.short ? "color:var(--red)" : ""}">${hm(sum.net)}</small>`
        : sum && sum.off ? `<small>${{ vacation: "חופש", sick: "מחלה", reserve: "מילואים" }[sum.off]}</small>` : "";
      // (proposed) the Hebrew day in the corner
      const heb = inside && state.hebrew ? `<span class="hd">${hebrew(d).day}</span>` : "";
      cells += `<span class="dc"${inside ? ` data-menu="day:${d.getDate()}"` : ""} style="background:${fill};${inside ? "" : "opacity:.3;"}${isToday ? "box-shadow:inset 0 0 0 1.6px var(--accent);" : ""}">
        ${heb}<b style="color:${color};font-weight:${weight}">${d.getDate()}</b>${under}</span>`;
    }
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="scroll" data-scroll="calendar"><div class="scr"><h1 class="large">לוח</h1>${periodBar(state.hebrew)}<div class="cal glass">${cells}</div>
        ${summary([["ימי עבודה", String(t.days.size)], ["שעות", hm(t.hours)], ["שעות חוסר", hm(t.missing)], ["סה״כ", moneyShort(income(t))]])}
      </div></div><div class="home-ind"></div></div>`;
  }

        ${sec("התראות", row("התראות על המשמרת", "פועל"))}

  /** A workplace's page, pushed from Settings: its name, its pay from each date, newest first, a global pay's terms, its standard
   *  hours, and (proposed) the rest of what its employer sets: overtime, breaks, Shabbat and night, a holiday's eve, vacation and
   *  sick days and their balances, the pension, travel and its place's reminder; another workplace can be deleted. */
  function placePage(i) {
    const s = shift(), second = i === 1, global = isGlobal() && !second, name = second ? SECOND.name : PLACE;
    const row = (title, value) => `<div class="setrow"><span>${title}</span><span class="val">${value}</span></div>`;
    const sec = (title, rows, note) => `<section class="sec">${title ? `<div class="sec-title">${title}</div>` : ""}<div class="sec-card glass">${rows}</div>
      ${note ? `<p class="sec-note">${note}</p>` : ""}</section>`;
    // Pro's: marked without it, a tap opening Shifty Pro
    const proSec = (title, rows, note) => state.pro ? sec(title, rows, note)
      : `<button class="locked" type="button" data-sheet="pro"><section class="sec"><div class="sec-title">${title}<span class="pro-badge">Pro</span></div><div class="sec-card glass">${rows}</div></section></button>`;
    const pct = (v) => `<span class="num">${v}%</span>`;
    const term = (from, pay, now) => `<button class="setrow link" type="button" data-sheet="pay"><span class="when"><span>${pay}</span><small>מ־${from}</small></span>
      ${now ? '<span class="now-tag">עכשיו</span>' : ""}<span class="chev">${sized(icon.chevron, 14)}</span></button>`;
    const terms = second ? term("1 בספטמבר 2026", `${CUR} ${SECOND.wage} לשעה`, true)
      : (isGlobal() ? term(firstOfMonth(), `${moneyShort(SALARY)} לחודש · גלובלי`, true) : "") + term("1 בינואר 2026", `${CUR} ${WAGE} לשעה`, !isGlobal());
    const add = `<button class="setrow add" type="button" data-sheet="pay">${icon.plus}שינוי בשכר מתאריך</button>`;
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="navbar" style="justify-content:flex-start"><button class="circle glass" type="button" data-page="" aria-label="הגדרות">${icon.back}</button></div>
      <div class="scroll" data-scroll="place${i}"><div class="scr"><h1 class="large">${name}</h1>
        ${sec("", row("שם", name))}
        ${sec("ותק", row("תאריך תחילת עבודה", second ? "1 בספטמבר 2026" : "15 במרץ 2021"),
          second ? "חודשיים. דמי הבראה מגיעים אחרי שנת עבודה."
            : "5 שנים ו־7 חודשים. לפיו נקבעים ימי החופשה בשנה ודמי ההבראה.")}
        ${sec("שכר", terms + add, "משמרות שלפני כל תאריך נשארות בשכר שהיה אז.")}
        ${global ? sec("השכר עכשיו", row("שעות נוספות", coverText())
          + (state.cover === "upTo" || state.cover === "none" ? row("ערך שעה", `<span class="ltr num">${money(HOUR_VALUE)}</span>`) : "")
          + row("בונוס שנתי", `<span class="ltr num">${moneyShort(BONUS)}</span> במרץ`),
          state.cover === "tiers" ? "כל יעד שמגיעים אליו בחודש מוסיף את הבונוס שלו." : "ערך שעה הוא השכר החודשי חלקי 182.") : ""}
        ${sec("תקופת השכר", row("יום תחילת החודש", `<span class="num">${second ? SECOND.start : 1}</span>`),
          second ? "החודש שבתלוש של המעסיק הזה. לפיו נספרים השעות הנוספות והיעדים שלו."
            : "החודש שבתלוש של המעסיק. לפיו מקובצות המשמרות, ונספרים השעות הנוספות והיעדים.")}
        ${sec("שעות תקן ליום", second ? row("ו׳", `<span class="num">5:30</span>`) : row("א׳–ד׳", `<span class="num">9:06</span>`) + row("ה׳", `<span class="num">8:06</span>`))}
        ${sec("שעות נוספות", row("שעתיים ראשונות", pct(125)) + row("מעבר לכך", pct(150)))}
        ${sec("הפסקות, שבת ולילה", row("הפסקה אוטומטית", second || !state.autoBreak ? "אין" : `<span class="num">30</span> דק׳`) + row("תוספת שבת וחג", pct(150))
          + row("חישוב שעות לילה", "כבוי"), "כשיש הפסקה אוטומטית, היא יורדת לבד מכל משמרת ארוכה, ואין כפתור הפסקה במסך עכשיו.")}
        ${sec("ערב חג", row("שעות עבודה בערב חג", `<span class="num">4:06</span>`))}
        ${sec("חופשה ומחלה", row("שעות ליום חופש", `<span class="num">${second ? "5:30" : "8:36"}</span>`) + row("מחלה, יום 1", pct(0))
          + row("מחלה, יום 2 ו־3", pct(50)) + row("מחלה, מיום 4", pct(100)))}
        ${proSec("יתרת חופשה ומחלה", row("מעקב יתרות", "פועל") + row("ימי חופשה בשנה", `<span class="num">${second ? 12 : 17}</span> לפי הוותק`)
          + row("צו ההרחבה חל", "פועל"),
          second ? "שנה ראשונה: 12 ימים, לפי החלק היחסי של השנה." : "שנה 6 בשבוע של 5 ימים: 17 ימים לפי צו ההרחבה (14 לפי החוק). הצו חל על רוב מקומות העבודה, לא על מקום עם פחות מ־4 עובדים, חברות ממשלתיות ועירוניות ומשק בית. אם מקבלים יותר, אפשר לרשום.")}
        ${proSec("דמי הבראה", row("תעריף ליום", `<span class="ltr num">${CUR} 451.5</span>`)
          + `<div class="setrow"><div class="seg-in"><button type="button" class="on">פעם בשנה</button><button type="button">כל חודש</button></div></div>`
          + row("בחודש", "יולי"),
          second ? "מגיעים אחרי שנת עבודה, לפי היקף המשרה." : "7 ימים בשנה לפי הוותק, במשרה מלאה לפי שעות התקן. התעריף במגזר הפרטי ב־2026.")}
        ${sec("פנסיה", row("הפרשת עובד", pct(6)) + row("הפרשת מעביד", pct(6.5)) + row("פיצויים", pct(second ? 6 : 8.33)),
          "החלק שלך יורד מהנטו המשוער. החלק של המעביד מופיע בדף הנטו.")}
        ${sec("קרן השתלמות", row("הפרשת עובד", pct(second ? 0 : 2.5)) + row("הפרשת מעביד", pct(second ? 0 : 7.5)),
          "משכר של עד ₪15,712 בחודש, התקרה הפטורה ממס ב־2026. החלק שלך יורד מהנטו המשוער.")}
        ${sec("נסיעות", `<div class="setrow"><div class="seg-in"><button type="button" class="${second ? "on" : ""}">לפי יום</button>
          <button type="button" class="${second ? "" : "on"}">לחודש</button></div></div>`
          + (second ? row("החזר נסיעות ליום", "אין") : row("סכום לחודש מלא", `<span class="ltr num">${CUR} 600</span>`)),
          second ? "תקרה של 0 היא בלי תקרה." : "סכום קבוע בכל חודש. נכנס למס, לא לפנסיה.")}
        ${proSec("תזכורת לפי מיקום", row(`כשמגיעים ל${name} ויוצאים`, "כבוי"))}
        ${second ? sec("", `<button class="setrow red" type="button" data-del="1">מחיקת מקום העבודה</button>`) : ""}
      </div></div><div class="home-ind"></div></div>`;
  }

  /** (proposed) A change of the pay from a date, on a sheet: by the hour or global; for a global pay, the month's and what it
   *  does with overtime: covers all of it, some hours, none, or (proposed) pays a bonus at each target of hours; and an
   *  annual bonus. */
  function paySheet() {
    const global = isGlobal();
    const row = (title, value) => `<div class="setrow"><span>${title}</span>${value}</div>`;
    const chip = (value) => `<span class="vchip">${value}</span>`;
    const kind = `<div class="setrow"><div class="seg-in"><button type="button" class="${global ? "" : "on"}" data-pay="hourly">לפי שעה</button>
      <button type="button" class="${global ? "on" : ""}" data-pay="global">גלובלי</button></div></div>`;
    const rows = row("מתאריך", chip(global ? firstOfMonth() : "1 בינואר 2026")) + kind
      + (global ? row("שכר חודשי", chip(`<span class="ltr">${moneyShort(SALARY)}</span>`)) : row("שכר לשעה", chip(`<span class="ltr">${CUR} ${WAGE}</span>`)));
    // the overtime: one of four, each with its line; then its hours covered, or its targets
    const covers = COVERS.map(([key, title, line]) => `<button class="setrow pick" type="button" data-cover="${key}">
      <span class="when"><span>${title}</span><small>${line}</small></span>${state.cover === key ? `<span class="tick">${sized(icon.check, 18)}</span>` : ""}</button>`).join("");
    const detail = state.cover === "upTo" ? row("עד", chip(`${OT_IN} שעות בחודש`))
      : state.cover === "tiers" ? TIERS.map(([h, amount]) => row(`ביעד של <span class="num">${h}</span> שעות`, chip(`<span class="ltr">${moneyShort(amount)}</span>`))).join("")
        + `<button class="setrow add" type="button">${icon.plus}הוספת יעד</button>` : "";
    const detailNote = state.cover === "tiers" ? "כל יעד שמגיעים אליו בחודש מוסיף את הבונוס שלו להכנסה ולנטו. השעון מראה כמה נשאר ליעד הבא."
      : state.cover === "all" ? "השעון ימשיך לספור את השעות הנוספות." : "ערך שעה הוא השכר החודשי חלקי 182, ב־125% וב־150%.";
    const overtime = global ? `<div class="sec-title">שעות נוספות</div><div class="sec-card glass">${covers}</div>
      ${detail ? `<div class="sec-card glass">${detail}</div>` : ""}<p>${detailNote}</p>` : "";
    const note = global ? "ההחתמה נשארת כמו שהיא: השעות, היעד והנוספות נספרים, והשכר של התקופה הוא השכר החודשי."
      : "משמרות שלפני התאריך נשארות בשכר הקודם. השכר החדש חל מהיום הזה והלאה.";
    // an annual bonus, with the pay of its month: in that month's income and net
    const bonus = row("סכום", chip(`<span class="ltr">${moneyShort(global ? BONUS : 0)}</span>`)) + (global ? row("בחודש", chip("מרץ")) : "");
    return `<button class="dim" type="button" data-sheet="" aria-label="סגירה"></button>
      <div class="sheet pay-sheet"><span class="grab"></span>
        <div class="sheet-bar"><button class="circle glass" type="button" data-sheet="" aria-label="ביטול">${icon.close}</button><b>שינוי בשכר</b>
          <button class="circle prominent" type="button" data-sheet="" aria-label="שמירה">${icon.check}</button></div>
        <div class="sec-card glass">${rows}</div><p>${note}</p>${overtime}
        <div class="sec-title">בונוס שנתי</div><div class="sec-card glass">${bonus}</div>
        <p>סכום קבוע שמגיע פעם בשנה, עם השכר של החודש שבחרת. הוא נכנס להכנסה ולנטו המשוער של אותו חודש.</p></div>`;
  }

  // ---- the menus of a long press: what was pressed lifted, with what can be done to it ----
  const line = (a, b, c) => `<div><span>${a}</span><span class="num">${b}</span><span class="num"><span class="ltr">${c}</span></span></div>`;
  /** A shift lifted: its day and hours, its pay by rate, its break and its note; a global pay's, its hours alone. */
  function shiftPreview(e) {
    let lines;
    const wage = e.wage || WAGE, byHours = e.hourly === false, pay = (v) => byHours ? "" : money(v);
    if (e.type === "work") {
      const regular = Math.min(e.net, e.std), extra = Math.max(0, e.net - e.std), a = Math.min(extra, 2), b = Math.max(0, extra - 2);
      lines = line("שעות רגילות", hm(regular), pay(regular * wage))
        + (a > 0.01 ? line("נוספות 125%", hm(a), pay(a * wage * 1.25)) : "") + (b > 0.01 ? line("נוספות 150%", hm(b), pay(b * wage * 1.5)) : "")
        + (e.breakMin ? line("הפסקה", hm(e.breakMin / 60), "") : "");
    } else if (e.type === "reserve") {
      // (proposed) a day of reserve duty, for the record: no pay counted, and no total
      lines = line("יום מילואים", "", "");
    } else {
      lines = e.type === "vacation" ? line("חופשה בתשלום", hm(e.net), pay(e.pay)) : line("יום מחלה 1", "0%", pay(0));
    }
    const when = e.type !== "work" ? "" : e.end == null ? `מ־${clock(new Date(e.start))}` : range(e);
    const note = e.type === "reserve" ? (byHours ? "המשכורת ממשיכה גם בימי המילואים."
      : "לתיעוד. התגמול משולם לפי כללי ביטוח לאומי, שמשתנים כל שנה, ולכן לא נכלל בחישוב.") : e.note;
    const total = e.type === "reserve" ? "" : `<div class="pv-total"><span>${e.running ? "עד עכשיו" : "סה״כ"}</span><b class="num"><span class="ltr">${byHours ? hm(e.net) : money(e.pay)}</span></b></div>`;
    return `<div class="pv"><div class="pv-head"><b>${dayLine(e.day)}</b><span class="num">${when}</span></div><div class="pv-lines">${lines}</div>
      ${note ? `<div class="pv-note">${note}</div>` : ""}${total}</div>`;
  }
  /** A day lifted: its shifts or its day off, or that it has none. */
  function dayPreview(date, entries) {
    const worked = entries.filter((e) => e.type === "work"), hours = worked.reduce((a, e) => a + e.net, 0);
    const pay = (e) => e.hourly === false || e.type === "reserve" ? "" : money(e.pay), byHours = entries.length > 0 && entries.every((e) => e.hourly === false);
    // (proposed) a day of reserve duty alone has no total: its pay is not counted
    const record = entries.length > 0 && entries.every((e) => e.type === "reserve");
    const lines = entries.map((e) => e.type !== "work" ? line({ vacation: "חופשה בתשלום", sick: "יום מחלה", reserve: "יום מילואים" }[e.type], "", pay(e))
      : line(e.end == null ? `מ־${clock(new Date(e.start))}` : `<span class="num">${range(e)}</span>`, hm(e.net), pay(e))).join("");
    // (proposed) the Hebrew date under the day's
    const title = dayLine(date) + (state.hebrew ? `<small>${hebrewDay(date)}</small>` : "");
    return `<div class="pv"><div class="pv-head"><b>${title}</b><span class="num">${worked.length ? hm(hours) + " שע׳" : ""}</span></div>
      ${entries.length ? `<div class="pv-lines">${lines}</div>${record ? "" : `<div class="pv-total"><span>סה״כ</span><b class="num"><span class="ltr">${byHours ? hm(hours) : money(entries.reduce((a, e) => a + e.pay, 0))}</span></b></div>`}`
        : `<div class="pv-empty">אין משמרת ביום זה</div>`}</div>`;
  }
  /** What a long press on `key` opens: a preview (or the thing itself, lifted) and the menu's sections. */
  function menuFor(key) {
    const [kind, arg] = key.split(":"), s = shift();
    const item = (title, svg, more) => Object.assign({ title, svg }, more);
    const remove = (title) => ({ items: [item(title || "מחיקה", icon.trash, { red: true })] });
    // (proposed) a day of reserve duty, added as a sick day is: from the plus, or an empty day's menu
    const reserve = item("יום מילואים", icon.shield);
    if (kind === "shift") {
      const e = periodShifts(s)[+arg];
      if (!e) return null;
      const sections = e.type !== "work" ? [{ items: [item("העתקת הסיכום", icon.copy)] }, remove()]
        : [{ items: [item("עריכה", icon.pencil)].concat(e.running ? [] : [item("שכפול להיום", icon.dup)], [item("העתקת הסיכום", icon.copy)]) }, remove()];
      return { preview: shiftPreview(e), sections };
    }
    if (kind === "day") {
      const today = midnight(), month = periodStart(), date = new Date(month.getFullYear(), month.getMonth(), +arg), sum = byDay(periodShifts(s)).get(+arg);
      const entries = sum ? sum.entries : [];
      const sections = !entries.length ? [{ items: [item("משמרת", icon.timer), item("יום חופש", icon.sun), item("יום מחלה", icon.sick), reserve] }]
        : sum.off ? [{ items: [item("פתיחת היום", icon.calendar)] }, remove()]
        : [{ items: [item("פתיחת היום", icon.calendar)].concat(+date === +today || entries.length !== 1 ? [] : [item("שכפול להיום", icon.dup)]) }, remove(entries.length > 1 ? "מחיקת המשמרות" : "")];
      return { preview: dayPreview(date, entries), sections };
    }
    if (kind === "act") {
      // pressed too late: the moment it happened, a few minutes back, or another time
      const ago = (m) => item(m === 60 ? "לפני שעה" : `לפני ${m} דקות`, null, { sub: clock(new Date(s.now - m * 60000)) });
      const other = { items: [item("בשעה אחרת…", icon.clock)] };
      const sections = {
        start: [{ head: "התחלתי כבר", items: [ago(15), ago(30), ago(60)] }, other],
        brk: [{ head: "יצאתי להפסקה", items: [ago(10), ago(20), ago(30)] }],
        end: [{ head: "לסיום עכשיו, להחזיק את הכפתור עד שיתמלא", items: [] }, { head: "סיימתי כבר", items: [ago(15), ago(30)] }, other],
        back: [{ head: "חזרתי מההפסקה", items: [ago(5), ago(10)] }],
      }[arg];
      return sections ? { sections } : null;
    }
    if (kind === "plus") return { sections: [{ items: [item("משמרת", icon.timer), item("יום חופש", icon.sun), item("יום מחלה", icon.sick), reserve] }] };
    // (proposed) where the next shift is, with two workplaces: a tap on the line on top
    if (kind === "place") {
      const choice = (i, name) => item(name, state.next === i ? sized(icon.check, 19) : null, { data: `data-next="${i}"` });
      return { sections: [{ head: "המשמרת הבאה", items: [choice(0, PLACE), choice(1, SECOND.name)] }] };
    }
    return null;
  }

  // ---- the Live Activity, as built (Widget/ShiftLiveActivity.swift) ----
  const roundIcon = (svg, tint, size) => `<span class="ri" style="--tint:${tint};width:${size}px;height:${size}px">${sized(svg, Math.round(size * 0.36))}</span>`;
  function activityCard(s) {
    const onBreak = s.open != null;
    const tint = onBreak ? "var(--orange)" : "var(--accent)";
    const clockText = onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const head = onBreak ? `בהפסקה<span class="place">· עבדת ${timer(s.netMs)}</span>` : `במשמרת<span class="place">· ${PLACE}</span>`;
    const share = Math.min(1, s.net / GOAL_H);
    const goalText = s.remaining > 0 ? "יעד <span class=\"num\">" + clock(new Date(s.finish)) + "</span>" : "הגעת ליעד ✓";
    return `<div class="activity">
      <div class="a-top"><div class="a-left">
          <div class="a-head"><span class="dot" style="background:${tint}"></span>${head}</div>
          <div class="a-clock num" style="color:${tint}"><span class="ltr">${clockText}</span></div></div>
        <div class="a-btns">${onBreak || !state.autoBreak ? roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", 50) : ""}${roundIcon(icon.stop, "var(--red)", 50)}</div></div>
      <div class="a-bar"><i style="width:${share * 100}%;background:${tint}"></i></div>
      <div class="a-way"><span>התחלה <span class="num">${clock(new Date(s.start))}</span></span><span>${goalText}</span></div>
    </div>`;
  }

  const lockWall = (s) => `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}
    <div class="lock-date">${dayLine(new Date(s.now))}</div><div class="lock-clock">${clock(new Date(s.now))}</div>
    <div class="lock-buttons"><div>${icon.flash}</div><div>${icon.camera}</div></div><div class="home-ind" style="background:#fff"></div>`;

  function lockScreen() {
    const s = shift();
    // without Shifty Pro, nothing of the shift on the Lock Screen
    if (!state.pro) return lockWall(s);
    if (!s.running) return lockWall(s) + `<div class="activity" style="align-items:center;color:var(--ink-2);font-size:14px">אין משמרת שרצה, ואין Live Activity</div>`;
    return lockWall(s) + activityCard(s);
  }

  // ---- the place: asked on arriving at work and on leaving it (proposed) ----
  function placeScreen() {
    const s = shift();
    const started = s.running ? clock(new Date(s.start)) : "07:15";
    const note = (title, text, time) => `<div class="notif"><span class="n-icon">${sized(icon.timer, 22)}</span>
      <div class="n-body"><div class="n-top"><b>${title}</b><span>${time}</span></div><div class="n-text">${text}</div></div></div>`;
    return lockWall(s) + `<div class="notes" style="top:226px;gap:8px">
      <div class="w-label">כשמגיעים לעבודה, בלחיצה ארוכה</div>
      ${note("הגעת ל" + PLACE, "להתחיל משמרת עכשיו?", "07:14")}
      <div class="n-actions"><div class="main">התחל משמרת</div><div>לא עכשיו</div></div>
      <div class="w-label" style="margin-top:10px">כשמגיעים ליעד</div>
      ${note("🎯 הגעת ליעד היומי", hm(GOAL_H) + " שעות · " + money(GOAL_H * WAGE) + " · מעכשיו שעות נוספות", "15:51")}
      <div class="w-label" style="margin-top:10px">כשיוצאים מהעבודה</div>
      ${note("יצאת מ" + PLACE, "המשמרת פתוחה מ־" + started + ". לסיים אותה?", "16:02")}
      <div class="n-actions"><div class="main" style="color:var(--red)">סיים משמרת</div><div>אני עדיין בעבודה</div></div>
    </div>`;
  }

  // ---- Siri's answers (Questions.swift), and the period's summary and the break's reminder (Alerts) ----
  function askScreen() {
    const s = shift();
    const today = s.running ? `היום עבדת ${spoken(s.net)} והרווחת ${moneyShort(s.pay)}. המשמרת עדיין פתוחה.`
      : `היום עבדת ${spoken(7.5)} והרווחת ${moneyShort(7.5 * WAGE)}.`;
    const goal = !s.running ? "אין משמרת פתוחה עכשיו."
      : s.remaining <= 0.001 ? "הגעת ליעד של היום. מעכשיו שעות נוספות."
      : s.open != null ? `בהפסקה עכשיו. נשארו ${spoken(s.remaining)} עד היעד.`
      : `נשארו ${spoken(s.remaining)} עד היעד, ב־<span class="num">${clock(new Date(s.finish))}</span>.`;
    const period = `בתקופה הזו עבדת ${spoken(112.5)} והרווחת ${moneyShort(6075.4)}. הצפי לסוף התקופה: ${moneyShort(NET.gross)} ברוטו, בערך ${moneyShort(NET.net)} נטו.`;
    const answer = (asked, text) => `<div class="w-label">״${asked}״</div>
      <div class="siri"><span class="mini-icon">${appIcon[dark() ? "dark" : "light"]}</span><div class="n-body"><div class="s-app">Shifty</div><div class="s-text">${text}</div></div></div>`;
    const note = (title, text, time) => `<div class="notif"><span class="mini-icon">${appIcon[dark() ? "dark" : "light"]}</span>
      <div class="n-body"><div class="n-top"><b>${title}</b><span>${time}</span></div><div class="n-text">${text}</div></div></div>`;
    // over the home screen, as Siri answers anywhere
    return `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}<div class="home-ind" style="background:#fff"></div>
      <div class="notes" style="top:64px;gap:7px">
      ${answer("כמה הרווחתי היום ב-Shifty?", today)}
      ${answer("כמה נשאר ליעד ב-Shifty?", goal)}
      ${answer("כמה עבדתי החודש ב-Shifty?", period)}
      <div class="w-label" style="margin-top:8px">בבוקר שאחרי סוף התקופה</div>
      ${note("סיכום אוקטובר 2026", `<span class="num">152:10</span> שעות · ${moneyShort(NET.gross)} ברוטו · כ־${moneyShort(NET.net)} נטו`, "09:00")}
      <div class="w-label" style="margin-top:8px">אחרי 6 שעות בלי הפסקה, בלחיצה ארוכה</div>
      ${note("⏸️ שש שעות ברצף", "זה זמן טוב לעצור להפסקה.", "13:15")}
      <div class="n-actions"><div class="main" style="color:var(--orange)">התחל הפסקה</div></div>
    </div>`;
  }

  // ---- the home screen's icon: light, dark, and tinted in the color picked on the iPhone ----
  function iconScreen() {
    const s = shift();
    const band = (look, title, wall) => `<div class="icon-band"><div class="wall ${wall}"></div><span class="look">${title}</span>
      <span class="big">${appIcon[look]}</span><span class="name">Shifty</span></div>`;
    return `<div class="wall dark-wall"></div>${statusBar(s.now, true)}<div class="icon-rows">
      ${band("light", "בהיר", "")}${band("dark", "כהה", "dark-wall")}${band("tinted", "צבוע", "dark-wall")}
    </div><div class="home-ind" style="background:#fff"></div>`;
  }

  function islandScreen() {
    const s = shift();
    const wall = `<div class="wall dark-wall"></div>${statusBar(s.now, true)}`;
    if (!state.pro) return wall + `<div class="widgets" style="top:120px"><div class="w-label" style="font-size:14px">ה-Dynamic Island ב-Shifty Pro</div></div>`;
    if (!s.running) return wall + `<div class="widgets" style="top:120px"><div class="w-label" style="font-size:14px">אין משמרת שרצה</div></div>`;
    const onBreak = s.open != null, tint = onBreak ? "var(--orange)" : "var(--accent)";
    const t = onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const share = Math.min(1, s.net / GOAL_H);
    return wall + `
      <div class="di di-compact" style="color:${tint}"><span style="width:18px;height:18px;display:block">${onBreak ? icon.pause : icon.timer}</span><span class="num" style="font-size:14px;font-weight:600;width:64px;text-align:center"><span class="ltr">${t}</span></span></div>
      <div class="widgets" style="top:70px"><div class="w-label">מצומצם: הסמל מימין, והשעון משמאל ברוחב שלם</div></div>
      <div class="di di-expanded" style="top:150px">
        <div class="di-row"><span style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:${tint}"></span>${onBreak ? "בהפסקה" : "במשמרת"}</span>
          <span class="num" style="font-size:26px;font-weight:600;color:${tint}"><span class="ltr">${t}</span></span></div>
        <div style="display:flex;align-items:center;gap:14px"><div style="flex:1;display:flex;flex-direction:column;gap:6px">
            <div class="a-bar" style="background:rgba(255,255,255,.14)"><i style="width:${share * 100}%;background:${tint}"></i></div>
            <div class="a-way" style="margin:0;color:rgba(255,255,255,.6)"><span>התחלה <span class="num">${clock(new Date(s.start))}</span></span><span>יעד <span class="num">${clock(new Date(s.finish))}</span></span></div></div>
          <div class="a-btns">${onBreak || !state.autoBreak ? roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", 42) : ""}${roundIcon(icon.stop, "var(--red)", 42)}</div></div>
      </div>
      <div class="widgets" style="top:330px"><div class="w-label">פתוח, בלחיצה ארוכה</div></div>`;
  }

  function widgetsScreen() {
    const s = shift();
    // without Shifty Pro, the widgets ask for it, a tap opening Shifty
    if (!state.pro) {
      const locked = (cls, label) => `<div><div class="w ${cls}"><div class="w-lock">${icon.lock}<span>Shifty Pro</span></div></div>
        <div class="w-label" style="margin-top:6px">${label}</div></div>`;
      return `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}
        <div class="widgets">${locked("w-small", "קטן")}${locked("w-medium", "בינוני")}</div><div class="home-ind" style="background:#fff"></div>`;
    }
    const running = s.running, onBreak = running && s.open != null;
    const tint = !running ? "var(--ink)" : onBreak ? "var(--orange)" : "var(--accent)";
    const title = !running ? "היום" : onBreak ? "בהפסקה" : "במשמרת";
    const dot = !running ? "var(--ink-3)" : onBreak ? "var(--orange)" : "var(--green)";
    const t = !running ? "7:30" : onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const share = running ? Math.min(1, s.net / GOAL_H) : 7.5 / GOAL_H;
    const wayEnd = !running ? "יעד " + hm(GOAL_H) : s.remaining > 0 ? "יעד " + clock(new Date(s.finish)) : "הגעת ליעד ✓";
    const wayStart = !running ? money(7.5 * WAGE) : "התחלה " + clock(new Date(s.start));
    const btns = (size) => running
      ? (onBreak || !state.autoBreak ? roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", size) : "") + roundIcon(icon.stop, "var(--red)", size)
      : roundIcon(icon.play, "var(--accent)", size);
    const bar = `<div class="a-bar"><i style="width:${share * 100}%;background:${onBreak ? "var(--orange)" : "var(--accent)"}"></i></div>`;
    return `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}
      <div class="widgets">
        <div><div class="w w-small">
          <div class="w-head"><span class="dot" style="background:${dot}"></span>${title}</div>
          <div style="flex:1"></div>
          <div class="w-clock num" style="font-size:34px;color:${tint}"><span class="ltr">${t}</span></div>
          <div style="margin-top:8px">${bar}</div>
          <div style="flex:1"></div>
          <div style="display:flex;align-items:center;gap:8px">${btns(36)}<span style="flex:1"></span><span class="num" style="font-size:11px;font-weight:600;color:var(--ink-2)">${wayEnd}</span></div>
        </div><div class="w-label" style="margin-top:6px">קטן</div></div>
        <div><div class="w w-medium">
          <div style="flex:1;display:flex;flex-direction:column;height:100%">
            <div class="w-head"><span class="dot" style="background:${dot}"></span>${title}</div>
            <div style="flex:1"></div>
            <div class="w-clock num" style="font-size:40px;color:${tint}"><span class="ltr">${t}</span></div>
            <div style="flex:1"></div>${bar}
            <div class="a-way" style="margin-top:6px;font-size:11px"><span>${wayStart}</span><span>${wayEnd}</span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">${btns(48)}</div>
        </div><div class="w-label" style="margin-top:6px">בינוני</div></div>
      </div><div class="home-ind" style="background:#fff"></div>`;
  }

  // ---- (proposed) the first setup, at the first launch: the workplace filled step by step, then the app. Each field has a
  //      sensible value but the pay, which is the user's to give ----
  function welcomeScreen() {
    const s = shift(), step = state.step, global = isGlobal();
    const row = (title, value) => `<div class="setrow"><span>${title}</span>${value}</div>`;
    const chip = (value) => `<span class="vchip">${value}</span>`;
    const foot = (label, more) => `<div class="wz-foot"><button class="capsule prominent" type="button" data-step="next">${label}</button>${more || ""}</div>`;
    const steps = `<div class="wz-top"><button class="circle glass" type="button" data-step="back" aria-label="חזרה">${icon.back}</button>
      <div class="wz-steps">${[1, 2, 3, 4].map((i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div></div>`;
    const page = (title, sub, body, label) => `<div class="wz">${statusBar(s.now)}<div class="wz-body"><h1 class="wz-title">${title}</h1>
      <p class="wz-sub">${sub}</p>${body}</div>${steps}${foot(label || "המשך")}<div class="home-ind"></div></div>`;
    const pay = global ? `${moneyShort(SALARY)} לחודש · גלובלי` : `${CUR} ${WAGE} לשעה`;
    if (step === 0) {
      const feat = (svg, title, text) => `<div>${svg}<div><b>${title}</b><span>${text}</span></div></div>`;
      return `<div class="wz">${statusBar(s.now)}<div class="wz-body wz-hello"><span class="mini-icon">${appIcon[dark() ? "dark" : "light"]}</span>
        <h1 class="wz-title">ברוכים הבאים ל-Shifty</h1><p class="wz-sub">השעות והשכר שלך, משמרת אחרי משמרת.</p>
        <div class="wz-feats">${feat(icon.timer, "משמרת בלחיצה", "התחלה, הפסקה וסיום, והשכר עולה תוך כדי.")}
          ${feat(icon.calendar, "כל החודש במבט", "שעות נוספות, חוסר מול התקן, חגים וימי חופש.")}
          ${feat(icon.money, "כמה ייכנס", "צפי לסוף התקופה, ונטו משוער ב-Shifty Pro.")}</div></div>
        ${foot("נתחיל", '<button class="pro-link" type="button">שחזור מגיבוי</button>')}<div class="home-ind"></div></div>`;
    }
    if (step === 1) {
      return page("מקום העבודה", "נתחיל במעסיק. אפשר לשנות הכול אחר כך בהגדרות.",
        `<div class="sec-card glass">${row("שם", `<span class="field">${PLACE}</span>`)}${row("תחילת עבודה", chip("15 במרץ 2021"))}</div>
        <p class="sec-note">לפי הוותק נקבעים ימי החופשה בשנה ודמי ההבראה. לא חובה.</p>`);
    }
    if (step === 2) {
      const kind = `<div class="setrow"><div class="seg-in"><button type="button" class="${global ? "" : "on"}" data-pay="hourly">לפי שעה</button>
        <button type="button" class="${global ? "on" : ""}" data-pay="global">גלובלי</button></div></div>`;
      const amount = global ? row("שכר חודשי", chip(`<span class="ltr">${moneyShort(SALARY)}</span>`)) : row("שכר לשעה", chip(`<span class="ltr">${CUR} ${WAGE}</span>`));
      const overtime = global ? `<button class="setrow link" type="button"><span>שעות נוספות</span><span class="val" style="margin-inline-start:auto">${COVERS[0][1]}</span>
        <span class="chev" style="margin-inline-start:8px">${sized(icon.chevron, 14)}</span></button>` : "";
      return page("השכר", "כמו שכתוב בחוזה או בתלוש.",
        `<div class="sec-card glass">${kind}${amount}${overtime}</div>
        <div class="sec-title">נסיעות</div>
        <div class="sec-card glass"><div class="setrow"><div class="seg-in"><button type="button">ליום</button><button type="button" class="on">לחודש</button></div></div>
          ${row("סכום לחודש מלא", chip(`<span class="ltr">${CUR} 600</span>`))}</div>
        <p class="sec-note">שעות נוספות, שבת, חופשה, מחלה ופנסיה כבר לפי החוק. אפשר לשנות אותם בדף של מקום העבודה.</p>`);
    }
    if (step === 3) {
      const on = [1, 1, 1, 1, 1, 0, 0];
      const chips = days.map((d, i) => `<span class="${on[i] ? "on" : ""}">${d.replace("׳", "")}</span>`).join("");
      return page("ימים ושעות", "יום עבודה רגיל. מעבר לשעות האלה נספרות שעות נוספות.",
        `<div class="sec-card glass"><div class="daychips">${chips}</div></div>
        <div class="sec-card glass">${row("שעות ביום", chip('<span class="num">9:06</span>'))}${row("ביום ה׳", chip('<span class="num">8:06</span>'))}
          <button class="setrow add" type="button">${icon.plus}יום עם שעות אחרות</button></div>
        <p class="sec-note">פחות מזה נספר כחוסר. בערב חג ובחג השעות מתעדכנות לבד.</p>`);
    }
    if (step === 4) {
      const pick = (day, title, line) => `<button class="setrow pick" type="button" data-from-day="${day}"><span class="when"><span>${title}</span><small>${line}</small></span>
        ${state.fromDay === day ? `<span class="tick">${sized(icon.check, 18)}</span>` : ""}</button>`;
      return page("תקופת השכר", "מאיזה יום בחודש מתחיל החודש בתלוש?",
        `<div class="sec-card glass">${pick(1, "מה־1 בחודש", "כמו אצל רוב המעסיקים")}${pick(20, "מיום אחר", "למשל מה־20 עד ה־19 בחודש הבא")}</div>
        ${state.fromDay !== 1 ? `<div class="sec-card glass">${row("מיום", chip(`<span class="num">${state.fromDay}</span>`))}</div>` : ""}
        <p class="sec-note">לפי התקופה מקובצות המשמרות ונספרות השעות הנוספות, ובסופה מגיע סיכום.</p>`, "סיום");
    }
    const lines = [[PLACE, pay], ["א׳–ה׳", "9:06 ביום · ה׳ 8:06"], ["תקופת השכר", `מה־${state.fromDay} בחודש`]];
    return `<div class="wz">${statusBar(s.now)}<div class="wz-body wz-done"><span class="ok">${sized(icon.check, 34)}</span>
      <h1 class="wz-title">הכול מוכן</h1><p class="wz-sub">אפשר לשנות כל דבר בהגדרות, בדף של מקום העבודה.</p>
      <div class="sec-card glass">${lines.map(([a, b]) => row(a, `<span class="val">${b}</span>`)).join("")}</div></div>
      <div class="wz-foot"><button class="capsule prominent" type="button" data-step="start">${icon.play}התחלת משמרת</button>
        <button class="pro-link" type="button" data-step="app">אחר כך</button></div><div class="home-ind"></div></div>`;
  }

  // ---- (proposed) the home screen's icon, pressed long: Shifty's quick actions, by the shift's state ----
  function quickScreen() {
    const s = shift(), onBreak = s.running && s.open != null;
    const item = (title, svg, sub) => `<div class="qa-item"><span>${title}${sub ? `<small class="num">${sub}</small>` : ""}</span>${sized(svg, 20)}</div>`;
    const since = s.running ? "מ־" + clock(new Date(s.start)) : "";
    const items = !s.running ? item("התחלת משמרת", icon.play, PLACE) + item("הוספת משמרת", icon.plus) + item("יום חופש", icon.sun)
      : onBreak ? item("חזרה לעבודה", icon.play, "בהפסקה מ־" + clock(new Date(s.open))) + item("סיום משמרת", icon.stop, since)
      : (state.autoBreak ? "" : item("הפסקה", icon.pause)) + item("סיום משמרת", icon.stop, since) + item("הוספת משמרת", icon.plus);
    // the other apps' icons, under the blur; Shifty's is lifted from its place
    let grid = "";
    for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) if (r !== 2 || c !== 2) grid += `<i style="top:${74 + r * 96}px;left:${27 + c * 93}px"></i>`;
    return `<div class="wall ${dark() ? "dark-wall" : ""}"></div><div class="qa-grid">${grid}</div><div class="qa-dim"></div>${statusBar(s.now, true)}
      <span class="qa-icon" style="top:266px;left:213px">${appIcon[dark() ? "dark" : "light"]}</span>
      <div class="qa-menu" style="top:342px;right:125px">${items}</div>
      <div class="home-ind" style="background:#fff"></div>`;
  }

    widgets: '<span class="tag built">כמו שבבנייה</span>הווידג\'טים למסך הבית. בחינם הם מציעים את Shifty Pro, ולחיצה פותחת אותו באפליקציה.',

    quick: '<span class="tag built">כמו שבבנייה</span>לחיצה ארוכה על הסמל של Shifty במסך הבית. הפעולות משתנות לפי המצב ("במשמרת / בהפסקה / לא במשמרת" למעלה). "סיום משמרת" מכאן מסיים מיד, כי זו כבר בחירה מכוונת. מתחת iOS מוסיף את הפעולות שלו.',
  };
  // the app's tabs, and what is new on each
  const appNotes = {
    now: '<span class="tag built">כמו שבבנייה</span>שעת ההגעה (Pro, עם תזכורת לפי מיקום): אם הגעת לעבודה 5 דקות או יותר לפני שהמשמרת התחילה, מתחת לשעון מופיעה הצעה להתחיל משעת ההגעה. לחיצה מזיזה את ההתחלה, ו־✕ סוגר. <span class="tag built">כמו שבבנייה</span>תאריך עברי בשעון, ליד התאריך (הגדרות › תצוגה, כבוי כברירת מחדל). <span class="tag built">כמו שבבנייה</span>כרטיס התקופה, מסודר: התאריכים בשורה אחת ובלי השנה, הסכום עד עכשיו והצפי לסוף התקופה באותה שורה ומתחת לכל אחד השם שלו, כמו המספרים שמתחתם. מספר שהוא אפס, כמו "0:00 חוסר", באפור. <span class="tag built">כמו שבבנייה</span>דמי הבראה (Pro, למטה): כמה ימים מגיעים לפי הוותק, כמה הם שווים ומתי ישולמו. <span class="tag built">כמו שבבנייה</span>בונוס צבור (Pro, בשכר גלובלי למטה): כמה מהבונוס השנתי כבר נצבר מאז התשלום הקודם, ומתי ישולם. בדף הנטו: קרן ההשתלמות יורדת מהנטו, ומתחתיו מה שהמעביד מפריש בשבילך. <span class="tag built">כמו שבבנייה</span>סיום משמרת בלחיצה ארוכה: הכפתור מתמלא בשנייה וחצי, ורק אז המשמרת מסתיימת. עזיבה לפני כן מרוקנת אותו, ולחיצה רגילה פותחת את "סיימתי כבר". כשיש הפסקה אוטומטית במקום העבודה, אין כפתור הפסקה, גם לא במסך הנעילה ובווידג׳ט, והסיום תופס את כל השורה (המתג "הפסקה אוטומטית" למעלה). בשכר גלובלי, מתחת לשעון השעות הנוספות של החודש במקום השכר שעולה. עם שני מקומות עבודה, לחיצה על השורה למעלה (כשאין משמרת) בוחרת איפה המשמרת הבאה. עם בונוס ביעד: מתחת לשעות הנוספות כמה נשאר לבונוס הבא, ובכרטיס התקופה "6:30 מתוך 20".',
    shifts: '<span class="tag built">כמו שבבנייה</span>יום מילואים, כמו יום מחלה: בכפתור ה־+ ובלחיצה ארוכה על יום ריק בלוח. הוא מסומן ברשימה ובלוח לתיעוד, לא נספר כחוסר ולא יורד מימי החופשה. התגמול לא נכלל בחישוב, כי הכללים והסכומים של ביטוח לאומי משתנים כל שנה. בדוגמה: 13–17 בחודש. <span class="tag built">כמו שבבנייה</span>בשכר גלובלי, בכל משמרת השעות שלה במקום סכום, והסה״כ הוא השכר החודשי. עם שני מקומות עבודה, שם המקום בכל שורה.',
    calendar: '<span class="tag built">כמו שבבנייה</span>תאריך עברי (הגדרות › תצוגה, כבוי כברירת מחדל): היום העברי בפינה של כל יום, החודשים העבריים מתחת לשם החודש, והתאריך העברי בפירוט של יום. <span class="tag built">כמו שבבנייה</span>ימי מילואים מסומנים "מילואים". <span class="tag built">כמו שבבנייה</span>לחיצה ארוכה על יום: הפירוט שלו ותפריט. בשכר גלובלי, הסה״כ הוא השכר החודשי.',
    settings: '<span class="tag built">כמו שבבנייה</span>תצוגה › תאריך עברי (לחיצה מפעילה ומכבה). <span class="tag built">כמו שבבנייה</span>בדף של מקום העבודה: תאריך תחילת עבודה והוותק, ימי החופשה בשנה לפי הוותק (צו ההרחבה או החוק), ודמי הבראה (תעריף, פעם בשנה או כל חודש). <span class="tag built">כמו שבבנייה</span>בדף של מקום העבודה: הפרשות המעביד לפנסיה ולפיצויים, קרן השתלמות עד התקרה, ונסיעות כסכום לחודש מלא. <span class="tag built">כמו שבבנייה</span>כל מה שהמעסיק קובע עובר לדף של מקום העבודה: תקופת השכר, שעות נוספות, הפסקות, שבת ולילה, ערב חג, חופשה ומחלה והיתרות, הפנסיה והתזכורת לפי מיקום. בהגדרות נשאר מה שלך: חגים, יעד ההכנסה, נקודות זיכוי, מראה, התראות ו-iCloud. בשינוי בשכר לגלובלי: ארבע אפשרויות לשעות הנוספות, ובהן "בונוס ביעד".',
  };
  const device = document.getElementById("device"), stage = document.getElementById("stage");
  const view = document.getElementById("view"), chrome = document.getElementById("chrome"), layer = document.getElementById("layer");
  const dark = () => state.theme === "dark" || (state.theme == null && matchMedia("(prefers-color-scheme: dark)").matches);
  let scale = 1;

  // ---- the tab bar, built once: its lens slides to the tab chosen ----
  const tabIcons = { now: icon.timer, shifts: icon.list, calendar: icon.calendar, settings: icon.gear };
  const tabNames = { now: "עכשיו", shifts: "משמרות", calendar: "לוח", settings: "הגדרות" };
  chrome.innerHTML = `<nav class="tabs glass"><span class="lens"></span>${TABS.map((t) => `<button class="t" type="button" data-tab="${t}">${tabIcons[t]}<span>${tabNames[t]}</span></button>`).join("")}</nav>
    <button class="tab-mini glass" type="button" data-expand aria-label="הצגת הלשוניות"></button>`;
  const replay = (el, name) => { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); };
  function switchTab(tab) {
    if (tab === state.tab) return;
    state.tab = tab;
    state.plan = null;
    state.sheet = null;
    closeMenu();
    replay(chrome.querySelector(".lens"), "moving");
    save(); render();
  }

  /** The tab bar, on the app's screens. */
  function updateChrome() {
    const app = state.screen === "now";
    chrome.hidden = !app;
    device.classList.toggle("tabs-min", app && mini);
    if (!app) return;
    chrome.style.setProperty("--i", TABS.indexOf(state.tab));
    for (const b of chrome.querySelectorAll("[data-tab]")) b.classList.toggle("on", b.dataset.tab === state.tab);
    const small = chrome.querySelector(".tab-mini");
    if (small.dataset.shows !== state.tab) { small.dataset.shows = state.tab; small.innerHTML = tabIcons[state.tab]; }
  }

  // ---- the screen, drawn again each second: each tab keeps its scroll, and it waits while a finger scrolls, drags or holds ----
  let touched = 0, dragging = false, frame = 0, mini = false, lastY = 0, restored = null;
  const scrolls = {};
  const touch = () => { touched = Date.now(); };
  document.addEventListener("touchmove", touch, { passive: true });
  // scrolling down shrinks the tab bar to its tab, and scrolling up brings it back
  document.addEventListener("scroll", (e) => {
    const el = e.target;
    if (!(el instanceof Element) || !el.classList.contains("scroll")) return;
    if (restored && el === restored.el && el.scrollTop === restored.top) return;   // its place, given back after drawing
    restored = null;
    touch();
    const y = el.scrollTop, dy = y - lastY;
    lastY = y;
    if (y < 24 || dy < -4) setMini(false);
    else if (dy > 4) setMini(true);
  }, true);
  function setMini(on) {
    if (mini === on) return;
    mini = on;
    device.classList.toggle("tabs-min", state.screen === "now" && on);
  }
  function render() {
    const old = view.querySelector(".scroll");
    if (old) scrolls[old.dataset.scroll] = old.scrollTop;
    const settings = () => state.page != null ? placePage(+state.page) : settingsScreen();
    view.innerHTML = state.screen === "now"
      ? { now: nowScreen, shifts: shiftsScreen, calendar: calendarScreen, settings }[state.tab]()
      : { lock: lockScreen, island: islandScreen, widgets: widgetsScreen, place: placeScreen, ask: askScreen, icon: iconScreen, welcome: welcomeScreen,
          quick: quickScreen }[state.screen]();
    if (state.screen === "now" && state.sheet === "pro") view.insertAdjacentHTML("beforeend", proSheet());
    if (state.screen === "now" && state.sheet === "pay") view.insertAdjacentHTML("beforeend", paySheet());
    const again = view.querySelector(".scroll");
    if (again) {
      again.scrollTop = scrolls[again.dataset.scroll] || 0;
      restored = { el: again, top: again.scrollTop };
      lastY = again.scrollTop;
    }
    updateChrome();
    document.getElementById("note").innerHTML = state.screen === "now" ? appNotes[state.tab] : notes[state.screen];
    for (const b of document.querySelectorAll("[data-screen]")) {
      b.setAttribute("aria-pressed", String(b.dataset.screen === "pro" ? state.sheet === "pro" : b.dataset.screen === state.screen && state.sheet !== "pro"));
    }
    for (const b of document.querySelectorAll("[data-state]")) b.setAttribute("aria-pressed", String(b.dataset.state === state.state));
    for (const b of document.querySelectorAll("[data-theme-set]")) b.setAttribute("aria-pressed", String(b.dataset.themeSet === (dark() ? "dark" : "light")));
    for (const b of document.querySelectorAll("[data-pro]")) b.setAttribute("aria-pressed", String((b.dataset.pro === "1") === state.pro));
    for (const b of document.querySelectorAll(".bar [data-pay]")) b.setAttribute("aria-pressed", String(b.dataset.pay === state.pay));
    for (const b of document.querySelectorAll(".bar [data-places]")) b.setAttribute("aria-pressed", String(+b.dataset.places === state.places));
    for (const b of document.querySelectorAll(".bar [data-autobreak]")) b.setAttribute("aria-pressed", String((b.dataset.autobreak === "1") === state.autoBreak));
  }

  // dragging the flag along the dial: the time is the angle's on the twelve hours after the start, by five minutes
  function dragTo(x, y) {
    const el = device.querySelector(".dial"), s = shift();
    if (!el || !s.running) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let deg = Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    const after = ((deg - clockDeg(s.start)) % 360 + 360) % 360;
    let end = s.start + after / 30 * 3600000;
    end = Math.round(end / 300000) * 300000;
    state.plan = Math.max(s.now, end);
    touch();
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); });
  }
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".dial .goal")) return;
    dragging = true;
    e.preventDefault();
    dragTo(e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", (e) => { if (dragging) { e.preventDefault(); dragTo(e.clientX, e.clientY); } });
  document.addEventListener("pointerup", () => { dragging = false; });
  document.addEventListener("pointercancel", () => { dragging = false; });

  // ---- a long press: what was pressed shrinks a little, then lifts with its menu ----
  let press = null, suppress = 0;
  device.addEventListener("pointerdown", (e) => {
    const el = e.target.closest("[data-menu]");
    if (!el || state.menu || e.button > 0 || el.dataset.hold) return;
    touch();
    el.classList.add("pressing");
    press = { el, x: e.clientX, y: e.clientY, opened: false };
    press.timer = setTimeout(() => { if (!press) return; press.opened = true; el.classList.remove("pressing"); openMenu(el); }, 480);
  });
  function release() {
    if (!press) return;
    clearTimeout(press.timer);
    press.el.classList.remove("pressing");
    if (press.opened) suppress = Date.now() + 400;   // the lifting of the finger is not a tap on the menu
    press = null;
  }
  device.addEventListener("pointermove", (e) => { if (press && !press.opened && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) release(); });
  device.addEventListener("pointerup", release);
  device.addEventListener("pointercancel", release);

  // held to end: the button fills from its start in a second and a half, and then the shift ends; let go before, it empties.
  // A tap opens its menu (data-tap-menu); a hold let go is no tap
  let hold = null;
  device.addEventListener("pointerdown", (e) => {
    const el = e.target.closest("[data-hold]");
    if (!el || state.menu || e.button > 0) return;
    touch();
    el.classList.add("holding");
    hold = { el, x: e.clientX, y: e.clientY, at: Date.now() };
    hold.timer = setTimeout(() => {
      hold = null;
      suppress = Date.now() + 400;
      state.state = "idle";
      state.plan = null;
      save(); render();
    }, 1500);
  });
  function letGo() {
    if (!hold) return;
    clearTimeout(hold.timer);
    hold.el.classList.remove("holding");
    if (Date.now() - hold.at > 250) suppress = Date.now() + 400;
    hold = null;
  }
  device.addEventListener("pointermove", (e) => { if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 24) letGo(); });
  device.addEventListener("pointerup", letGo);
  device.addEventListener("pointercancel", letGo);
  device.addEventListener("contextmenu", (e) => {
    const el = e.target.closest("[data-menu]");
    if (!el) return;
    e.preventDefault();
    if (el.dataset.hold) return;
    if (press) { clearTimeout(press.timer); press.el.classList.remove("pressing"); press = null; }
    if (!state.menu) { openMenu(el); suppress = Date.now() + 400; }
  });
  function openMenu(el) {
    const def = menuFor(el.dataset.menu);
    if (!def) return;
    const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
    const box = { top: (r.top - d.top) / scale, left: (r.left - d.left) / scale, width: r.width / scale, height: r.height / scale };
    const sections = def.sections.map((sec) => `<div class="cm-sec">${sec.head ? `<div class="cm-head">${sec.head}</div>` : ""}${sec.items.map((it) =>
      `<button class="cm-item${it.red ? " red" : ""}" type="button" data-cm-close${it.data ? " " + it.data : ""}><span>${it.title}${it.sub ? `<small class="num">${it.sub}</small>` : ""}</span>${it.svg || ""}</button>`).join("")}</div>`).join("");
    const lifted = def.preview ? `<div class="cm-preview cm-card">${def.preview}</div>`
      : `<div class="cm-preview cm-src">${el.outerHTML.replace(/ data-menu="[^"]*"/, "").replace(/ data-hold="[^"]*"/, "").replace(" data-tap-menu", "").replace(" pressing", "").replace(" holding", "")}</div>`;
    layer.innerHTML = `<div class="cm"><button class="cm-dim" type="button" data-cm-close aria-label="סגירה"></button>${lifted}<div class="cm-menu" role="menu">${sections}</div></div>`;
    state.menu = el.dataset.menu;
    // a shift or a day lifted where it was, its menu under it; a button where it is, its menu over it when it is low on the
    // screen, on the button's side
    const pv = layer.querySelector(".cm-preview"), menu = layer.querySelector(".cm-menu");
    const H = 874, top = 60, bottom = H - 34, gap = 10, mh = menu.offsetHeight;
    if (def.preview) {
      const ph = pv.offsetHeight, y = Math.min(Math.max(top, box.top), Math.max(top, bottom - ph - gap - mh));
      pv.style.top = y + "px";
      menu.style.top = y + ph + gap + "px";
      menu.style.right = "16px";
      menu.style.transformOrigin = "top right";
    } else {
      Object.assign(pv.style, { top: box.top + "px", left: box.left + "px", width: box.width + "px", height: box.height + "px" });
      const above = box.top + box.height / 2 > H / 2, right = box.left + box.width / 2 > 201;
      menu.style.top = Math.min(Math.max(top, above ? box.top - gap - mh : box.top + box.height + gap), bottom - mh) + "px";
      if (right) menu.style.right = 402 - box.left - box.width + "px";
      else menu.style.left = box.left + "px";
      menu.style.transformOrigin = (above ? "bottom " : "top ") + (right ? "right" : "left");
    }
  }
  function closeMenu() {
    state.menu = null;
    layer.innerHTML = "";
  }

  function fit() {
    scale = Math.max(0.5, Math.min(document.documentElement.clientWidth - 32, 402) / 402);
    stage.style.setProperty("--s", String(scale));
    device.style.setProperty("--s", String(scale));
  }
  function save() {
    try {
      localStorage.setItem("shifty-preview", JSON.stringify({ screen: state.screen, state: state.state, theme: state.theme, tab: state.tab, pro: state.pro,
        pay: state.pay, places: state.places, next: state.next, cover: state.cover, autoBreak: state.autoBreak, step: state.step, hebrew: state.hebrew,
        fromDay: state.fromDay }));
    } catch (e) {}
  }

  document.addEventListener("click", (e) => {
    if (Date.now() < suppress) return;
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) return switchTab(b.dataset.tab);
    if ("expand" in b.dataset) return setMini(false);
    if ("cmClose" in b.dataset) {
      // a menu's choice of the next shift's workplace
      if (b.dataset.next != null) { state.next = +b.dataset.next; save(); render(); }
      return closeMenu();
    }
    // a menu opened by a tap, as SwiftUI's Menu: the workplace of the next shift
    if ("tapMenu" in b.dataset) return openMenu(b);
    if (b.dataset.reset) state.plan = null;
    // (proposed) the first setup's steps: on, back, and into the app, a shift started or not
    else if (b.dataset.step) {
      const go = b.dataset.step;
      if (go === "next") state.step = Math.min(5, state.step + 1);
      else if (go === "back") state.step = Math.max(0, state.step - 1);
      else { state.screen = "now"; state.tab = "now"; state.state = go === "start" ? "work" : "idle"; state.step = 0; state.sheet = null; setMini(false); }
    }
    else if (b.dataset.fromDay) state.fromDay = +b.dataset.fromDay;
    // (proposed) the arrival's tip: taken, the start moves back to it; or closed
    else if (b.dataset.tip) { if (b.dataset.tip === "take") state.early = Math.round((START - ARRIVED) / 60000); state.tip = false; }
    else if (b.dataset.hebrew) state.hebrew = !state.hebrew;
    // (proposed) the pay and the workplaces: the page's switches, a workplace's page, and deleting one
    else if (b.dataset.pay) state.pay = b.dataset.pay;
    else if (b.dataset.cover) state.cover = b.dataset.cover;
    else if (b.dataset.autobreak) state.autoBreak = b.dataset.autobreak === "1";
    else if (b.dataset.places) { state.places = +b.dataset.places; if (state.places === 1) { state.next = 0; if (state.page === "1") state.page = null; } }
    else if (b.dataset.del) { state.places = 1; state.next = 0; state.page = null; }
    else if (b.dataset.page != null) { state.page = b.dataset.page || null; state.sheet = null; }
    else if ("sheet" in b.dataset) state.sheet = b.dataset.sheet || null;
    // the purchase and its restoring, pretended: Pro opens, the sheet closes
    else if (b.dataset.buy) { state.pro = true; state.sheet = null; }
    else if (b.dataset.pro) { state.pro = b.dataset.pro === "1"; if (state.pro && state.sheet === "pro") state.sheet = null; }
    else if (b.dataset.screen === "pro") { state.screen = "now"; state.plan = null; state.sheet = "pro"; closeMenu(); setMini(false); }
    else if (b.dataset.screen) { state.screen = b.dataset.screen; state.plan = null; state.sheet = null; state.step = 0; closeMenu(); setMini(false); }
    else if (b.dataset.state) { state.state = b.dataset.state; state.plan = null; state.sheet = null; closeMenu(); }
    else if (b.dataset.themeSet) { state.theme = b.dataset.themeSet; document.documentElement.dataset.theme = state.theme; }
    else return;
    save(); render();
  });
  if (state.theme) document.documentElement.dataset.theme = state.theme;
  document.documentElement.lang = "he";
  addEventListener("resize", fit);
  fit(); render();
  setInterval(() => { if (!dragging && !press && !hold && Date.now() - touched > 1200) render(); }, 1000);
})();
</script>

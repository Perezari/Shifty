<title>Shifty לאייפון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
<style>
/* The iPhone app's screens in the browser, on an iPhone 17 Pro of 402 by 874 points, scaled to fit:
   the page's controls on top, the device under them. Colors are the app's (Assets.xcassets) and iOS's. */
:root {
  /* the page around the device */
  --page: #E7ECEC;
  --page-ink: #11181A;
  --page-ink-2: #5C686C;
  --page-line: rgba(17, 24, 26, .10);
  --chip: rgba(255, 255, 255, .72);
  /* the app (Assets.xcassets: AccentColor, Background, Holiday) and iOS's system colors */
  --app-bg: #F4F5F7;
  --ink: #0B0F12;
  --ink-2: rgba(60, 60, 67, .62);
  --ink-3: rgba(60, 60, 67, .32);
  --accent: #0F9D8F;
  --accent-deep: #0B7D72;
  --accent-soft: rgba(15, 157, 143, .16);
  --orange: #FF9500;
  --red: #FF3B30;
  --green: #34C759;
  --amber: #B07D2A;
  --track: rgba(11, 15, 18, .06);
  --knob: #FFFFFF;
  --glass: rgba(255, 255, 255, .62);
  --glass-edge: rgba(255, 255, 255, .9);
  --glass-shade: rgba(20, 30, 35, .07);
  --activity: rgba(255, 255, 255, .88);
  --notif: rgba(246, 246, 248, .8);
  --menu: rgba(250, 250, 252, .82);
  --sep: rgba(60, 60, 67, .16);
  --cm-dim: rgba(0, 0, 0, .06);
  --font-text: -apple-system, "SF Pro Text", system-ui, "Rubik", "Segoe UI", sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Rubik", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #08090B; --page-ink: #EEF2F2; --page-ink-2: #98A3A6; --page-line: rgba(238, 242, 242, .12);
    --chip: rgba(40, 44, 48, .72);
    --app-bg: #15171C; --ink: #F5F7F8; --ink-2: rgba(235, 235, 245, .62); --ink-3: rgba(235, 235, 245, .3);
    --accent: #1BB3A3; --accent-deep: #148F83; --accent-soft: rgba(27, 179, 163, .2);
    --orange: #FF9F0A; --red: #FF453A; --green: #30D158; --amber: #D8A64E;
    --track: rgba(255, 255, 255, .07); --knob: #F5F7F8; --glass: rgba(44, 48, 54, .55); --glass-edge: rgba(255, 255, 255, .14);
    --glass-shade: rgba(0, 0, 0, .35); --activity: rgba(28, 28, 30, .88); --notif: rgba(36, 36, 40, .78);
    --menu: rgba(48, 48, 52, .8); --sep: rgba(235, 235, 245, .14); --cm-dim: rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #08090B; --page-ink: #EEF2F2; --page-ink-2: #98A3A6; --page-line: rgba(238, 242, 242, .12);
  --chip: rgba(40, 44, 48, .72);
  --app-bg: #15171C; --ink: #F5F7F8; --ink-2: rgba(235, 235, 245, .62); --ink-3: rgba(235, 235, 245, .3);
  --accent: #1BB3A3; --accent-deep: #148F83; --accent-soft: rgba(27, 179, 163, .2);
  --orange: #FF9F0A; --red: #FF453A; --green: #30D158; --amber: #D8A64E;
  --track: rgba(255, 255, 255, .07); --knob: #F5F7F8; --glass: rgba(44, 48, 54, .55); --glass-edge: rgba(255, 255, 255, .14);
  --glass-shade: rgba(0, 0, 0, .35); --activity: rgba(28, 28, 30, .88); --notif: rgba(36, 36, 40, .78);
  --menu: rgba(48, 48, 52, .8); --sep: rgba(235, 235, 245, .14); --cm-dim: rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--page-ink); font-family: var(--font-text); }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* the controls */
.bar { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 520px) { .row { flex-direction: column; align-items: center; } }
.seg { display: inline-flex; background: var(--page-line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; justify-content: center; }
.seg button { font: 500 13px/1 var(--font-text); color: var(--page-ink); background: transparent; border: 0;
  border-radius: 999px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { font-size: 12.5px; color: var(--page-ink-2); text-align: center; text-wrap: balance; max-width: 52ch; line-height: 1.5; margin: 0; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); margin-inline-end: 6px; }
.tag.built { background: var(--page-line); color: var(--page-ink-2); }

/* the device: 402 x 874 points, scaled by --s */
.stage { width: calc(402px * var(--s, 1)); height: calc(874px * var(--s, 1)); position: relative; }
.device { position: absolute; top: 0; left: 0; width: 402px; height: 874px; transform: scale(var(--s, 1)); transform-origin: top left;
  border-radius: 56px; overflow: hidden; background: var(--app-bg); color: var(--ink); font-family: var(--font-text);
  box-shadow: 0 0 0 11px #1b1d20, 0 0 0 12px #3a3d42, 0 30px 60px rgba(0, 0, 0, .25);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
@media (max-width: 460px) { .device { box-shadow: 0 0 0 1px var(--page-line); border-radius: 40px; } }
.num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* iOS's status bar, right to left: the time on the right */
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 34px 0 30px; z-index: 5; font: 600 17px/1 var(--font-text); }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 6; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 6; }

/* Liquid Glass */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 0.5px 0 var(--glass-edge), inset 0 0 0 0.5px var(--glass-edge), 0 6px 20px var(--glass-shade); }

/* ---- the Now screen: the shift on a clock's dial ---- */
.now { position: absolute; inset: 0; }
/* the screen scrolls; its parts follow one another closely, the first card under the buttons peeking under the tab bar */
.now-scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.now-scroll::-webkit-scrollbar { display: none; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 20px 120px; }
.topline { display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px; }
.topline .dot { width: 8px; height: 8px; border-radius: 50%; }
.topline .place { color: var(--ink-2); font-weight: 500; }

/* 350 points: the track of 12 hours at a radius of 160, 22 wide; the ticks inside it; the hours at 120 */
.dial { position: relative; width: 350px; height: 350px; flex: none; }
.dial .face, .dial .arc { position: absolute; inset: 4px; border-radius: 50%;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 22px), #000 calc(100% - 21.5px)); }
.dial .face { background: var(--track); }
.dial .tick { position: absolute; left: 50%; top: 30px; width: 1.5px; height: 4px; margin-left: -0.75px; border-radius: 1px;
  background: var(--ink-3); transform-origin: 50% 145px; }
.dial .tick.major { width: 2px; margin-left: -1px; height: 9px; background: var(--ink-2); }
.dial .hour { position: absolute; font: 600 13px/1 var(--font-round); color: var(--ink-3); transform: translate(-50%, -50%); }
.dial .mark { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
.dial .knob { width: 32px; height: 32px; background: var(--knob); box-shadow: 0 0 0 3.5px var(--k), 0 4px 14px rgba(0, 0, 0, .22); }
.dial .knob::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--k); }
.dial .start { width: 22px; height: 22px; background: var(--accent-deep); color: #fff; }
/* the flag of the goal: drawn along the dial to see the wage of leaving at another time */
.dial .goal { width: 30px; height: 30px; background: var(--knob); color: var(--f); cursor: grab; touch-action: none;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--f) 18%, transparent), 0 2px 8px rgba(0, 0, 0, .16); }
.dial .goal-dot { width: 10px; height: 10px; background: var(--knob); box-shadow: 0 0 0 2.5px var(--accent); }
/* the goal reached: the flag is a check (and on the iPhone the ring glows a moment, and it taps) */
.dial .goal.done { background: var(--accent); color: #fff; }
.dial .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.dial .date-in { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.dial .time { font-size: 58px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
.dial .earned { font-size: 23px; font-weight: 600; color: var(--accent); }
.dial .plan-pay { font-size: 44px; font-weight: 600; letter-spacing: -1px; line-height: 1; color: var(--accent); }
.dial .delta { font-size: 13.5px; font-weight: 600; }
.reset { border: 0; background: var(--track); color: var(--ink); font: 600 12.5px/1 var(--font-text); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* the three numbers on one card of glass */
.facts { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 14px 6px; border-radius: 24px; }
.facts div + div { border-inline-start: 1px solid var(--track); }
.facts b { display: block; font: 600 21px/1.2 var(--font-round); font-variant-numeric: tabular-nums; }
.facts span { font-size: 12.5px; color: var(--ink-2); }

.actions { width: 100%; display: flex; gap: 10px; }
/* the buttons with the cards' corners, 24 points */
.capsule { flex: 1; height: 56px; border-radius: 24px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 17px/1 var(--font-text); color: var(--ink); cursor: pointer; }
.capsule svg { width: 17px; height: 17px; }
.capsule.prominent { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 22px color-mix(in srgb, var(--accent) 32%, transparent); }
.square { flex: none; width: 56px; padding: 0; }

.card { width: 100%; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-head .title { font-size: 16px; font-weight: 700; }
.card-head .meta { font-size: 13px; color: var(--ink-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .col { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.week .hrs { font: 600 11px/1 var(--font-round); color: var(--ink-2); height: 11px; }
.week .bar { width: 24px; height: 66px; border-radius: 8px; background: var(--track); position: relative; overflow: hidden; }
.week .bar i { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 8px; }
.week .bar.off { background: transparent; box-shadow: inset 0 0 0 1px var(--track); }
.week .day { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.week .today .day { color: var(--accent); }
.money-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.money-line > b { font: 700 30px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.money-line > span { font-size: 13px; color: var(--ink-2); }
.money-line > span b { font: 600 15px/1 var(--font-round); color: var(--ink); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding-top: 4px; }
.mini div + div { border-inline-start: 1px solid var(--track); }
.mini b { display: block; font: 600 17px/1.3 var(--font-round); font-variant-numeric: tabular-nums; }
.mini span { font-size: 12px; color: var(--ink-2); }
.banner { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; }
.banner .ico { width: 36px; height: 36px; flex: none; border-radius: 11px; background: color-mix(in srgb, var(--amber) 18%, transparent);
  color: var(--amber); display: flex; align-items: center; justify-content: center; }
.banner b { display: block; font-size: 15px; }
.banner span { font-size: 13px; color: var(--ink-2); }
.idea { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 8px; align-self: flex-start; }

/* ---- the tab bar of iOS 26, over every tab: the chosen tab on a lens that slides to the next; scrolling down shrinks it
   to its tab (tabBarMinimizeBehavior(.onScrollDown)) ---- */
.chrome { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.chrome[hidden] { display: none; }
.chrome > * { pointer-events: auto; }
.tabs { position: absolute; bottom: 24px; left: 16px; right: 16px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px;
  transform-origin: right center; transition: transform .38s cubic-bezier(.3, 1.15, .4, 1), opacity .22s; }
.tabs .lens { position: absolute; top: 4px; bottom: 4px; right: 4px; width: calc((100% - 8px) / 4); border-radius: 28px; background: var(--track);
  transform: translateX(calc(var(--i, 0) * -100%)); transition: transform .48s cubic-bezier(.3, 1.3, .45, 1); }
.tabs .lens.moving { animation: lens .48s ease; }
@keyframes lens { 35% { scale: 1.16 .9; } }
.tabs .t { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 10.5px/1 var(--font-text); color: var(--ink); cursor: pointer; }
.tabs .t.on { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; overflow: visible; }
/* (proposal 1) each tab's symbol moves as the tab is chosen, as SF Symbols' effects do: bounce, its layers one after another,
   wiggle, rotate */
.tabs .t.fx[data-fx="bounce"] svg { animation: fx-bounce .5s cubic-bezier(.3, .6, .4, 1); }
.tabs .t.fx[data-fx="layers"] svg .l { animation: fx-layer .42s ease-out both; }
.tabs .t.fx[data-fx="layers"] svg .l:nth-child(2) { animation-delay: .07s; }
.tabs .t.fx[data-fx="layers"] svg .l:nth-child(3) { animation-delay: .14s; }
.tabs .t.fx[data-fx="wiggle"] svg { animation: fx-wiggle .6s ease-in-out; }
.tabs .t.fx[data-fx="rotate"] svg { animation: fx-rotate .7s cubic-bezier(.45, 0, .2, 1); }
@keyframes fx-bounce { 30% { transform: scale(.8); } 65% { transform: scale(1.12); } }
@keyframes fx-layer { 45% { transform: translateY(-3.5px); } }
@keyframes fx-wiggle { 20% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 70% { transform: rotate(-5deg); } }
@keyframes fx-rotate { to { transform: rotate(90deg); } }
.tab-mini { position: absolute; bottom: 28px; right: 16px; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; display: flex;
  align-items: center; justify-content: center; color: var(--accent); cursor: pointer; opacity: 0; transform: scale(.5); pointer-events: none;
  transition: transform .38s cubic-bezier(.3, 1.2, .4, 1), opacity .2s; }
.tab-mini svg { width: 24px; height: 24px; }
.device.mini .tabs { opacity: 0; transform: scale(.3, .8); pointer-events: none; }
.device.mini .tab-mini { opacity: 1; transform: none; pointer-events: auto; }
/* (proposal 5) the running shift over the tab bar on the other tabs (tabViewBottomAccessory), beside it when it shrinks */
.acc { position: absolute; left: 16px; right: 16px; bottom: 96px; height: 50px; border-radius: 25px; display: flex; align-items: center;
  opacity: 0; transform: translateY(14px); pointer-events: none;
  transition: bottom .38s cubic-bezier(.3, 1.15, .4, 1), right .38s cubic-bezier(.3, 1.15, .4, 1), opacity .25s, transform .3s; }
.device.has-acc .acc { opacity: 1; transform: none; pointer-events: auto; }
.device.mini .acc { bottom: 31px; right: 80px; }
.acc-main { flex: 1; min-width: 0; height: 100%; border: 0; background: none; display: flex; align-items: center; gap: 9px; padding: 0 18px 0 8px;
  color: var(--ink); cursor: pointer; font: inherit; }
.acc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.acc-clock { font: 600 18px/1 var(--font-round); }
.acc-label { font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.device.mini .acc-label { display: none; }
.acc-pay { margin-inline-start: auto; font: 600 15px/1 var(--font-round); color: var(--accent); white-space: nowrap; }
.acc-btn { width: 38px; height: 38px; flex: none; margin-inline-end: 6px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center;
  justify-content: center; cursor: pointer; color: var(--tint); background: color-mix(in srgb, var(--tint) 16%, transparent); }
.acc-btn svg { width: 16px; height: 16px; }

/* ---- the Lock Screen and the home screen ---- */
.wall { position: absolute; inset: 0; background:
  radial-gradient(120% 70% at 80% 10%, #9CC9C3 0%, transparent 60%),
  radial-gradient(90% 60% at 10% 40%, #E7C7A2 0%, transparent 60%),
  radial-gradient(120% 80% at 50% 100%, #4F6F7A 0%, transparent 70%),
  linear-gradient(180deg, #CFE0DD, #6E8A93); }
.dark-wall { background:
  radial-gradient(120% 70% at 80% 10%, #1F4D49 0%, transparent 60%),
  radial-gradient(90% 60% at 10% 40%, #4A3A2B 0%, transparent 60%),
  radial-gradient(120% 80% at 50% 100%, #0C1418 0%, transparent 70%),
  linear-gradient(180deg, #1A2A2C, #05080A); }
.lock-date { position: absolute; top: 76px; width: 100%; text-align: center; color: rgba(255, 255, 255, .92); font-size: 19px; font-weight: 600; }
.lock-clock { position: absolute; top: 96px; width: 100%; text-align: center; color: rgba(255, 255, 255, .92); font-family: var(--font-round);
  font-size: 104px; font-weight: 600; letter-spacing: -2px; }
.lock-buttons { position: absolute; bottom: 44px; left: 46px; right: 46px; display: flex; justify-content: space-between; }
.lock-buttons div { width: 50px; height: 50px; border-radius: 50%; background: rgba(0, 0, 0, .28); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center; color: #fff; }
.activity { position: absolute; left: 12px; right: 12px; bottom: 120px; border-radius: 24px; padding: 16px 18px; background: var(--activity);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); color: var(--ink); display: flex; flex-direction: column; gap: 12px; }
.a-top { display: flex; align-items: center; gap: 12px; }
.a-left { flex: 1; min-width: 0; }
.a-head { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.a-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.a-head .place { font-weight: 400; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.a-clock { font-size: 44px; font-weight: 600; color: var(--accent); line-height: 1.1; }
.a-btns { display: flex; gap: 10px; }
.ri { border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; color: var(--tint); }
.ri::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--tint); opacity: .18; }
.ri svg { position: relative; }
.a-bar { height: 4px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; }
.a-bar i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 2px; background: var(--accent); }
.a-way { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: -6px; }

.di { position: absolute; left: 50%; transform: translateX(-50%); background: #000; color: #fff; }
.di-compact { top: 11px; height: 37px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 92px; }
.di-expanded { top: 11px; width: 378px; border-radius: 46px; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.di-row { display: flex; justify-content: space-between; align-items: center; }

.widgets { position: absolute; top: 78px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.w { border-radius: 24px; background: var(--app-bg); color: var(--ink); padding: 15px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); display: flex; flex-direction: column; }
.w-small { width: 170px; height: 170px; }
.w-medium { width: 364px; height: 170px; flex-direction: row; gap: 16px; align-items: center; }
.w-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }

<script>
(() => {
  "use strict";

  // ---- made-up data, as Demo.swift's: the repository is public, and the preview shows no one's real hours or wages ----
  const WAGE = 54, GOAL_H = 8.1, AUTO_BREAK_MIN = 30, PLACE = "סטודיו גל", CUR = "₪";
  const loaded = Date.now();
  const at = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
  // each state as a moment of today's shift, from 07:15; the moment runs on from when the page opened
  const START = at(7, 15);
  const scenes = {
    work: { now: START + ((5 * 60 + 17) * 60 + 13) * 1000, breaks: [[150, 25]] },                     // 5:17 in, after a break of 25 minutes
    over: { now: START + ((9 * 60 + 12) * 60 + 5) * 1000, breaks: [[150, 25]] },                      // past the goal, overtime
    break: { now: START + ((3 * 60 + 4) * 60 + 40) * 1000, breaks: [[0, null]], breakFor: 6 * 60 + 12 }, // on a break for 6:12
    idle: { now: at(17, 5), today: [[at(7, 15), at(11, 0)], [at(11, 30), at(15, 15)]] },               // after a shift of 7:30
  };
  const TABS = ["now", "shifts", "calendar", "settings"];
  const state = { screen: "now", state: "work", theme: null, tab: "now", plan: null, sheet: null };
  try { Object.assign(state, JSON.parse(localStorage.getItem("shifty-preview") || "{}")); } catch (e) {}
  state.plan = null;
  state.sheet = null;
  if (!scenes[state.state]) state.state = "work";
  if (!TABS.includes(state.tab)) state.tab = "now";

  // ---- Format (Shifty/Core/Format.swift) ----
  const pad = (n) => String(n).padStart(2, "0");
  const clock = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const timer = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s); };
  const hm = (hours) => { const t = Math.round(Math.max(0, hours) * 60); return Math.floor(t / 60) + ":" + pad(t % 60); };
  const money = (v) => CUR + " " + v.toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const moneyShort = (v) => CUR + " " + Math.round(v).toLocaleString("he-IL");
  const days = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
  const months = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
  const dayLine = (d) => "יום " + days[d.getDay()] + ", " + d.getDate() + " ב" + months[d.getMonth()];

  /** The wage of a day of `net` hours: its standard at the wage, then 125% for two hours and 150% after (Calc.breakdown). */
  const payFor = (net) => (Math.min(net, GOAL_H) + Math.min(Math.max(0, net - GOAL_H), 2) * 1.25 + Math.max(0, net - GOAL_H - 2) * 1.5) * WAGE;
  /** The net hours of the shift if it ends at `end`: its breaks, or the automatic break once it is six hours long. */
  const netAt = (start, breakMs, end) => {
    const gross = end - start;
    return Math.max(0, gross - (gross >= 6 * 3600000 ? Math.max(breakMs, AUTO_BREAK_MIN * 60000) : breakMs)) / 3600000;
  };

  // ---- the net pay, as Net.swift gives it at 2026's rates: the period heading to ₪ 8,640, ₪ 8,200 of it pensionable ----
  const BRACKETS = [[7010, .10], [10060, .14], [19000, .20], [25100, .31], [46690, .35], [60130, .47], [Infinity, .50]];
  function netPay(gross, pensionable, points = 2.25, pensionPct = 6) {
    const pension = pensionable * pensionPct / 100;
    let tax = 0, floor = 0;
    for (const [top, rate] of BRACKETS) { if (gross > floor) tax += (Math.min(gross, top) - floor) * rate; floor = top; }
    const credit = points * 242 + 0.35 * Math.min(pension, 0.07 * Math.min(pensionable, 9700));
    const insured = Math.min(gross, 51910), reduced = Math.min(insured, 7703), full = insured - reduced;
    const p = { gross, incomeTax: Math.max(0, tax - credit), insurance: reduced * .0104 + full * .07, health: reduced * .0323 + full * .0517, pension };
    p.net = gross - p.incomeTax - p.insurance - p.health - p.pension;
    return p;
  }
  const NET = netPay(8640, 8200);
  /** "6 שעות ו־42 דקות", as Siri says it (Questions.swift). */
  const spoken = (hours) => {
    const t = Math.max(0, Math.round(hours * 60)), h = Math.floor(t / 60), m = t % 60;
    const ht = h === 1 ? "שעה" : h === 2 ? "שעתיים" : h + " שעות", mt = m === 1 ? "דקה" : m + " דקות";
    return h === 0 ? mt : m === 0 ? ht : ht + " ו־" + mt;
  };

  // ---- the shift at this moment, as Calc.nowStatus gives it ----
  function shift() {
    const scene = scenes[state.state], elapsed = (Date.now() - loaded) / 1000;
    const now = scene.now + elapsed * 1000;
    if (!scene.breaks) return { now, running: false, today: scene.today };
    const start = START;
    let breakMs = 0, open = null; const breaks = [];
    for (const [after, minutes] of scene.breaks) {
      if (minutes == null) { const since = now - (scene.breakFor + elapsed) * 1000; open = since; breaks.push([since, now]); breakMs += now - since; }
      else { const bs = start + after * 60000; breaks.push([bs, bs + minutes * 60000]); breakMs += minutes * 60000; }
    }
    const net = netAt(start, breakMs, now), pay = payFor(net);
    const finish = start + GOAL_H * 3600000 + Math.max(breakMs, AUTO_BREAK_MIN * 60000);
    return { now, running: true, start, breaks, breakMs, open, netMs: net * 3600000, net, pay, overtime: Math.max(0, net - GOAL_H),
      remaining: GOAL_H - net, finish, projected: net > 0.001 ? pay * (GOAL_H / net) : 0 };
  }

  /** Leaving at `end`: the shift's net hours and wage then, against the goal's. */
  function planAt(s, end) {
    const net = netAt(s.start, s.breakMs, end), pay = payFor(net);
    return { end, net, pay, extra: net - GOAL_H, extraPay: pay - payFor(GOAL_H) };
  }

  // ---- icons, as the SF Symbols the app uses ----
  const icon = {
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
    // list.bullet as iOS draws it right to left, each line a layer of its own

  // the app's icon in its three looks (ios/AppIcon.svg, AppIcon-dark.svg, AppIcon-tinted.svg); the tinted one as iOS colors it, here amber

  };
  const sized = (svg, size) => svg.replace("<svg", `<svg width="${size}" height="${size}"`);
  const statusBar = (now, light) => `
    <div class="island"></div>
    <div class="status" style="${light ? "color:#fff" : ""}">
      <span class="num">${clock(new Date(now))}</span>
      <span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></svg></span>
    </div>`;

  // ---- the dial: twelve hours as an analog clock, the shift on it from its start to the day's goal ----
  const C = 175, R = 160;
  const clockDeg = (t) => { const d = new Date(t); return ((d.getHours() % 12) + d.getMinutes() / 60 + d.getSeconds() / 3600) * 30; };
  const spanDeg = (ms) => Math.min(360, Math.max(0, ms / 3600000 * 30));
  const point = (deg, r) => { const a = deg * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; };
  /** One conic gradient of the arc's pieces, each [from, to, color] in degrees from the start, in order. */
  const arc = (fromDeg, pieces) => {
    const stops = pieces.filter(([a, b]) => b > a).map(([a, b, c]) => `${c} ${a.toFixed(2)}deg ${b.toFixed(2)}deg`);
    const last = pieces.length ? Math.max(...pieces.map((p) => p[1])) : 0;
    return `conic-gradient(from ${fromDeg.toFixed(2)}deg, ${stops.join(", ")}${stops.length ? ", " : ""}transparent ${last.toFixed(2)}deg 360deg)`;
  };
  const face = () => {
    let ticks = "";
    for (let i = 0; i < 60; i++) ticks += `<i class="tick${i % 5 === 0 ? " major" : ""}" style="transform:rotate(${i * 6}deg)"></i>`;
    const hours = [[12, 0], [3, 90], [6, 180], [9, 270]].map(([h, deg]) => { const [x, y] = point(deg, 120); return `<span class="hour" style="left:${x}px;top:${y}px">${h}</span>`; }).join("");
    return `<div class="face"></div>${ticks}${hours}`;
  };

  function dial(s, center, plan) {
    let pieces = [], from = 0, marks = "";
    if (s.running) {
      from = clockDeg(s.start);
      const rel = (t) => spanDeg(t - s.start);
      const goal = rel(s.finish), now = rel(s.now);
      // the work, the breaks in orange, past the goal in amber
      let cursor = s.start;
      const work = (a, b) => {
        if (b <= a) return;
        if (b <= goal) pieces.push([a, b, "var(--accent)"]);
        else if (a >= goal) pieces.push([a, b, "var(--amber)"]);
        else { pieces.push([a, goal, "var(--accent)"]); pieces.push([goal, b, "var(--amber)"]); }
      };
      for (const [bs, be] of s.breaks) { work(rel(cursor), rel(bs)); pieces.push([rel(bs), rel(Math.min(be, s.now)), "var(--orange)"]); cursor = be; }
      if (cursor < s.now) work(rel(cursor), now);
      // ahead: to the goal in the accent's shade; with a plan, to the time chosen, past the goal in amber's, short of it in red's
      const leave = plan ? Math.max(now, rel(plan.end)) : goal;
      if (leave <= goal) {
        pieces.push([now, leave, "var(--accent-soft)"]);
        if (plan) pieces.push([leave, goal, "color-mix(in srgb, var(--red) 22%, transparent)"]);
      } else {
        pieces.push([now, goal, "var(--accent-soft)"]);
        pieces.push([Math.max(now, goal), leave, "color-mix(in srgb, var(--amber) 38%, transparent)"]);
      }
      const [sx, sy] = point(from, R), [fx, fy] = point(from + leave, R), [gx, gy] = point(from + goal, R), [nx, ny] = point(from + now, R);
      const knob = s.open != null ? "var(--orange)" : now > goal ? "var(--amber)" : "var(--accent)";
      const flagColor = plan ? (plan.extra >= 0 ? "var(--amber)" : "var(--red)") : "var(--accent)";
      const done = !plan && now >= goal;
      marks = `<span class="mark start" style="left:${sx}px;top:${sy}px">${sized(icon.play, 10)}</span>
        ${plan ? `<span class="mark goal-dot" style="left:${gx}px;top:${gy}px"></span>` : ""}
        <span class="mark knob" style="left:${nx}px;top:${ny}px;--k:${knob}"></span>
        <span class="mark goal${done ? " done" : ""}" style="left:${fx}px;top:${fy}px;--f:${flagColor}" aria-label="גרירה לבחירת שעת יציאה">${done ? icon.check : icon.flag}</span>`;
    } else if (s.today) {
      // a day with no shift running: today's shifts, faint, and the time now
      from = clockDeg(s.today[0][0]);
      const rel = (t) => spanDeg(t - s.today[0][0]);
      for (const [a, b] of s.today) pieces.push([rel(a), rel(b), "color-mix(in srgb, var(--accent) 45%, transparent)"]);
      const [nx, ny] = point(clockDeg(s.now), R);
      marks = `<span class="mark knob" style="left:${nx}px;top:${ny}px;--k:var(--ink-3)"></span>`;
    }
    return `<div class="dial">${face()}<div class="arc" style="background:${arc(from, pieces)}"></div>${marks}<div class="center">${center}</div></div>`;
  }

  // ---- the Now screen: proposed (Shifty/Views/NowView.swift, once this preview is agreed) ----
  function nowScreen() {
    const s = shift(), onBreak = s.running && s.open != null, past = s.running && s.remaining <= 0;
    const plan = s.running && state.plan != null ? planAt(s, Math.max(s.now, state.plan)) : null;
    const status = !s.running ? `<span class="dot" style="background:var(--ink-3)"></span>לא במשמרת`
      : onBreak ? `<span class="dot pulse" style="background:var(--orange)"></span><span style="color:var(--orange)">בהפסקה <span class="num ltr">${timer(s.now - s.open)}</span></span>`
      : `<span class="dot pulse" style="background:var(--green)"></span>במשמרת`;
    const top = `<div class="topline glass">${status}<span class="place">· ${PLACE}</span></div>`;
    const date = `<span class="date-in">${dayLine(new Date(s.now))}</span>`;
    let center, facts, actions;
    if (!s.running) {
      const today = 7.5;
      center = `${date}<span class="time num"><span class="ltr">${hm(today)}</span></span>
        <span class="earned num"><span class="ltr">${money(today * WAGE)}</span></span>`;
      facts = fact("14", "משמרות החודש") + fact(moneyShort(6075.4), "הכנסה החודש") + fact(hm(GOAL_H), "יעד יומי");
      actions = `<button class="capsule prominent" type="button" data-menu="act:start">${icon.play}התחל משמרת</button>
        <button class="capsule glass square" type="button" data-menu="plus" aria-label="הוספה ידנית">${icon.plus}</button>`;
    } else {
      if (plan) {
        const delta = plan.extra >= 0.0001
          ? `<span class="delta num" style="color:var(--amber)"><span class="ltr">+${hm(plan.extra)}</span> נוספות · <span class="ltr">+${money(plan.extraPay)}</span></span>`
          : plan.extra <= -0.0001 ? `<span class="delta num" style="color:var(--red)">חסרות <span class="ltr">${hm(-plan.extra)}</span> ליעד</span>`
          : `<span class="delta" style="color:var(--accent)">בדיוק ביעד</span>`;
        center = `<span class="date-in">אם תצא ב־<span class="num ltr">${clock(new Date(plan.end))}</span></span>
          <span class="plan-pay num"><span class="ltr">${money(plan.pay)}</span></span>${delta}
          <button class="reset" type="button" data-reset="1">חזרה</button>`;
      } else {
        center = `${date}<span class="time num"><span class="ltr">${timer(s.netMs)}</span></span>
          <span class="earned num"><span class="ltr">${money(s.pay)}</span></span>`;
      }
      const middle = plan ? fact(clock(new Date(plan.end)), "יציאה מתוכננת", plan.extra >= 0 ? "var(--amber)" : "var(--red)")
        : past ? fact("+" + hm(s.overtime), "שעות נוספות", "var(--amber)")
        : fact(clock(new Date(s.finish)), "יעד · עוד " + hm(s.remaining));
      facts = fact(clock(new Date(s.start)), "התחלה") + middle + fact(moneyShort(s.projected), "צפי ביעד");
      // as on the iPhone now (a39a6cd): the icon and the word in the button's color, on glass
      actions = onBreak
        ? `<button class="capsule prominent" type="button" data-menu="act:back">${icon.play}חזרה לעבודה</button>
           <button class="capsule glass" type="button" data-menu="act:end" style="color:var(--red)">${icon.stop}סיום משמרת</button>`
        : `<button class="capsule glass" type="button" data-menu="act:brk" style="color:var(--orange)">${icon.pause}הפסקה</button>
           <button class="capsule glass" type="button" data-menu="act:end" style="color:var(--red)">${icon.stop}סיום משמרת</button>`;
    }
    return `<div class="now">${statusBar(s.now)}
      <div class="now-scroll scroll" data-scroll="now"><div class="stack">${top}${dial(s, center, plan)}<div class="facts glass">${facts}</div>
        <div class="actions">${actions}</div>${weekCard(s)}${monthCard()}${holidayBanner()}${leaveCard()}</div></div>
      <div class="home-ind"></div>${state.sheet === "net" ? netSheet() : ""}</div>`;
  }
  const fact = (value, label, color) => `<div><b style="${color ? "color:" + color : ""}"><span class="ltr">${value}</span></b><span>${label}</span></div>`;

  // ---- ideas under the buttons, for the user to choose from ----
  /** The week, Sunday on the right: each day's hours against its standard, today's as it grows. */
  function weekCard(s) {
    const std = [9.1, 9.1, 9.1, 9.1, 8.1, null, null], past = [9.33, 9.68, 8.92, 9.2];
    const todayHours = s.running ? s.net : 7.5;
    let total = 0, missing = 0;
    const cols = std.map((goal, i) => {
      const hours = i < 4 ? past[i] : i === 4 ? todayHours : null;
      if (hours != null) { total += hours; if (goal && i < 4 && hours < goal) missing += goal - hours; }
      const share = goal && hours != null ? Math.min(1, hours / goal) : 0;
      const color = hours == null ? "transparent" : i === 4 ? "var(--accent)" : hours >= goal ? "var(--accent)" : "var(--red)";
      return `<div class="col${i === 4 ? " today" : ""}"><span class="hrs num">${hours != null ? hm(hours) : ""}</span>
        <span class="bar${goal ? "" : " off"}"><i style="height:${share * 100}%;background:${color};opacity:${i === 4 ? 0.85 : 1}"></i></span>
        <span class="day">${days[i].replace("׳", "")}</span></div>`;
    }).join("");
    return `<section class="card glass"><div class="card-head"><span class="title">השבוע</span>
      <span class="meta"><b class="ltr num">${hm(total)}</b> שעות${missing > 0.01 ? ` · חסרות <b class="ltr num" style="color:var(--red)">${hm(missing)}</b>` : ""}</span></div>
      <div class="week">${cols}</div></section>`;
  }

  /** The pay period: the income so far, where it is heading, and its overtime and hours missing. */
  function monthCard() {
    return `<section class="card glass"><div class="card-head"><span class="title">אוקטובר</span><span class="meta">נסגר בעוד 2 ימים</span></div>
      <div class="money-line"><b class="num"><span class="ltr">${moneyShort(6075.4)}</span></b><span>צפי לסוף החודש <b class="ltr num">${moneyShort(8640)}</b></span></div>
      <div class="mini"><div><b class="num">14</b><span>משמרות</span></div><div><b class="num" style="color:var(--amber)">6:30</b><span>נוספות</span></div><div><b class="num" style="color:var(--red)">2:10</b><span>חוסר</span></div></div>
      <button class="net-row" type="button" data-sheet="net">נטו משוער לסוף התקופה<b class="ltr">${moneyShort(NET.net)}</b><span class="chev">${sized(icon.chevron, 14)}</span></button>
      </section>`;

  /** The period's net pay line by line, on a sheet (NowView's NetSheet). */
  function netSheet() {
    const row = (title, value) => `<div><span>${title}</span><span class="ltr">${moneyShort(value)}</span></div>`;
    return `<button class="dim" type="button" data-sheet="" aria-label="סגירה"></button>
      <div class="sheet"><span class="grab"></span>
        <div class="sheet-head"><b>נטו משוער</b><span>אוקטובר 2026</span></div>
        <div class="lines">${row("ברוטו צפוי", NET.gross)}${row("מס הכנסה", NET.incomeTax)}${row("ביטוח לאומי", NET.insurance)}${row("מס בריאות", NET.health)}${row("פנסיה", NET.pension)}</div>
        <div class="net-total"><span>נטו</span><b class="ltr">${moneyShort(NET.net)}</b></div>
        <p>לפי מדרגות המס, ביטוח לאומי ומס בריאות של 2026, 2.25 נקודות זיכוי ו־6% לפנסיה מהשכר בלי שעות נוספות ונסיעות. אפשר לשנות בהגדרות.</p>
      </div>`;
  }

  /** The vacation and sick days left (Leave.swift): the last payslip's, and the months and days off since. */
  function leaveCard() {
    const tile = (svg, color, value, title) => `<div><span class="li" style="color:${color};background:color-mix(in srgb, ${color} 16%, transparent)">${sized(svg, 17)}</span>
      <div><b>${value}</b><span>${title}</span></div></div>`;
    return `<section class="card glass"><div class="card-head"><span class="title">חופשה ומחלה</span><span class="meta">מהתלוש של <span class="num">30/9</span></span></div>
      <div class="leave">${tile(icon.sun, "var(--amber)", "7.5", "ימי חופשה")}${tile(icon.cross, "#FF2D55", "18", "ימי מחלה")}</div></section>`;
  }

  /** A shortened day or a holiday coming, from the Hebrew calendar (Holidays.swift): its standard. */
  function holidayBanner() {
    return `<section class="banner glass"><span class="ico">${sized(icon.calendar, 20)}</span>
      <div style="flex:1"><b>יום מקוצר בעוד 3 ימים</b><span>ערב חג · יום א׳ · תקן 4:06</span></div></section>`;
  }

  // ---- the pay period's shifts, for the Shifts and Calendar tabs: made up, Sunday to Thursday from the 1st, and today's
  //      as the state above has it ----
  /** The wage of `net` hours on a day of `std`: 125% for two hours past it, 150% after. */
  const dayPay = (net, std) => (Math.min(net, std) + Math.min(Math.max(0, net - std), 2) * 1.25 + Math.max(0, net - std - 2) * 1.5) * WAGE;
  const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  /** The period's shifts and days off, the newest first: back from yesterday, thirteen shifts with a sick day and three days of
   *  vacation among them (with today's, the Now screen's fourteen), and none on the days before. */
  function periodShifts(s) {
    const today = midnight(), first = new Date(today.getFullYear(), today.getMonth(), 1), list = [];
    for (let d = new Date(today), n = 0, worked = 0; worked < 13;) {
      d.setDate(d.getDate() - 1);
      if (d < first) break;
      if (d.getDay() > 4) continue;
      n++;
      const day = new Date(d), std = day.getDay() === 4 ? 8.1 : 9.1;
      const r = (k) => { const x = Math.sin(day.getDate() * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
      if (n === 4) { list.push({ day, type: "sick", start: +day, net: std, pay: 0, std }); continue; }
      if (n >= 9 && n <= 11) { list.push({ day, type: "vacation", start: +day, net: std, pay: std * WAGE, std }); continue; }
      worked++;
      const start = new Date(day);
      start.setHours(7, Math.floor(r(1) * 9) * 5, 0, 0);
      const gross = Math.round((std + 0.5 + (r(2) - 0.2) * 1.4) * 12) / 12;
      const net = gross - 0.5;
      list.push({ day, type: "work", start: +start, end: +start + gross * 3600000, breakMin: 30, net, pay: dayPay(net, std), std,
        overtime: Math.max(0, net - std), short: net < std - 0.01, note: n === 6 ? "ישיבת צוות" : n === 14 ? "ספירת מלאי" : "" });
    }
    if (s.running) {
      list.push({ day: today, type: "work", start: s.start, end: null, breakMin: Math.round(s.breakMs / 60000), net: s.net, pay: s.pay, std: GOAL_H,
        overtime: s.overtime, running: true, onBreak: s.open != null });
    } else {
      for (const [a, b] of s.today) {
        const net = (b - a) / 3600000;
        list.push({ day: today, type: "work", start: a, end: b, breakMin: 0, net, pay: net * WAGE, std: GOAL_H, overtime: 0 });
      }
    }
    return list.sort((a, b) => b.start - a.start);
  }
  /** The period's hours, hours missing, shifts, days worked and income. */
  function totals(list) {
    const t = { hours: 0, missing: 0, count: 0, total: 0, days: new Set() };
    for (const e of list) {
      t.total += e.pay;
      if (e.type !== "work") continue;
      t.count++;
      t.hours += e.net;
      t.days.add(e.day.getDate());
      if (e.short) t.missing += e.std - e.net;
    }
    return t;
  }
  /** The period's days by their number: their shifts or day off, hours and pay. */
  function byDay(list) {
    const map = new Map();
    for (const e of list) {
      const k = e.day.getDate(), d = map.get(k) || { entries: [], net: 0, pay: 0, short: false, off: null };
      d.entries.unshift(e);
      d.pay += e.pay;
      if (e.type === "work") { d.net += e.net; d.short = d.short || !!e.short; } else d.off = e.type;
      map.set(k, d);
    }
    return map;
  }

  const summary = (cells) => `<div class="sum">${cells.map(([t, v]) => `<div><span>${t}</span><b><span class="ltr">${v}</span></b></div>`).join("")}</div>`;
  /** The period between the earlier one, on the right, and the later. */
  const periodBar = () => { const d = new Date();
    return `<div class="pbar"><span class="pb">${icon.back}</span><span class="pt">${months[d.getMonth()]} ${d.getFullYear()}${icon.down}</span><span class="pb">${icon.chevron}</span></div>`; };
  const range = (e) => `${clock(new Date(e.start))} – ${clock(new Date(e.end))}`;

  /** A shift's row (Components.swift ShiftRow): its day, its hours or the kind of day off, its pay, and how its hours add up. */
  function shiftRow(e, i) {
    const off = e.type !== "work";
    const time = e.type === "vacation" ? "חופשה בתשלום" : e.type === "sick" ? "יום מחלה"
      : e.end == null ? `התחלה <span class="num">${clock(new Date(e.start))}</span>` : `<span class="num">${range(e)}</span>`;
    const tag = e.running ? `<span class="rtag${e.onBreak ? " brk" : ""}">${e.onBreak ? "בהפסקה" : "פעילה"}</span>` : "";
    const meta = e.type === "vacation" ? `${hm(e.net)} שע׳ בתשלום` : e.type === "sick" ? "יום 1 · 0% מהתקן"
      : [hm(e.net) + " שע׳", e.breakMin ? `הפסקה ${e.breakMin}׳` : "", e.overtime > 0.01 ? "נ.ש " + hm(e.overtime) : ""].filter(Boolean).join(" · ");
    return `<div class="srow glass" data-menu="shift:${i}">
      <span class="badge${e.short ? " short" : ""}${off ? " off" : ""}"><b>${e.day.getDate()}</b><small>${days[e.day.getDay()].replace("׳", "")}</small></span>
      <div class="sbody"><div class="sline"><b>${time}</b>${tag}<span class="spay num"><span class="ltr">${money(e.pay)}</span></span></div>
        <div class="smeta num">${meta}</div>${e.note ? `<div class="snote">${e.note}</div>` : ""}</div></div>`;
  }

  // ---- the Shifts tab (ShiftsView.swift): the period's numbers and its shifts ----
  function shiftsScreen() {
    const s = shift(), list = periodShifts(s), t = totals(list);
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="navbar"><button class="circle glass" type="button" data-menu="plus" aria-label="הוספת משמרת">${icon.plus}</button></div>
      <div class="scroll" data-scroll="shifts"><div class="scr"><h1 class="large">משמרות</h1>${periodBar()}
        ${summary([["שעות", hm(t.hours)], ["שעות חוסר", hm(t.missing)], ["משמרות", String(t.count)], ["סה״כ", moneyShort(t.total)]])}
        ${list.map(shiftRow).join("")}</div></div><div class="home-ind"></div></div>`;
  }

  // ---- the Calendar tab (CalendarView.swift): each day worked filled by its hours against its standard, red when short ----
  function calendarScreen() {
    const s = shift(), list = periodShifts(s), sums = byDay(list), t = totals(list), today = midnight();
    const first = new Date(today.getFullYear(), today.getMonth(), 1), last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    let cells = days.map((d) => `<span class="wd">${d.replace("׳", "")}</span>`).join("");
    for (let d = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay()); d <= last || d.getDay() !== 0; d.setDate(d.getDate() + 1)) {
      const inside = d >= first && d <= last, sum = inside ? sums.get(d.getDate()) : null, isToday = +d === +today;
      const worked = sum && sum.net > 0;
      const fill = !inside ? "transparent" : worked ? (sum.short ? "color-mix(in srgb, var(--red) 13%, transparent)"
          : `color-mix(in srgb, var(--accent) ${Math.round((0.09 + Math.min(1, sum.net / (d.getDay() === 4 ? 8.1 : 9.1)) * 0.17) * 100)}%, transparent)`)
        : sum && sum.off ? "color-mix(in srgb, var(--ink) 9%, transparent)" : "var(--track)";
      const color = sum && sum.short ? "var(--red)" : worked || isToday ? "var(--accent)" : "var(--ink)";
      const weight = isToday ? 800 : worked ? 700 : 500;
      const under = worked ? `<small style="${sum.short ? "color:var(--red)" : ""}">${hm(sum.net)}</small>` : sum && sum.off ? `<small>${sum.off === "vacation" ? "חופש" : "מחלה"}</small>` : "";
      cells += `<span class="dc"${inside ? ` data-menu="day:${d.getDate()}"` : ""} style="background:${fill};${inside ? "" : "opacity:.3;"}${isToday ? "box-shadow:inset 0 0 0 1.6px var(--accent);" : ""}">
        <b style="color:${color};font-weight:${weight}">${d.getDate()}</b>${under}</span>`;
    }
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="scroll" data-scroll="calendar"><div class="scr"><h1 class="large">לוח</h1>${periodBar()}<div class="cal glass">${cells}</div>
        ${summary([["ימי עבודה", String(t.days.size)], ["שעות", hm(t.hours)], ["שעות חוסר", hm(t.missing)], ["סה״כ", moneyShort(t.total)]])}
      </div></div><div class="home-ind"></div></div>`;
  }

  // ---- the Settings tab (SettingsView.swift), shortened: a few of its sections ----
  function settingsScreen() {
    const s = shift();
    const row = (title, value) => `<div class="setrow"><span>${title}</span><span class="val">${value}</span></div>`;
    const sec = (title, rows) => `<section class="sec"><div class="sec-title">${title}</div><div class="sec-card glass">${rows}</div></section>`;
    return `<div class="app">${statusBar(s.now)}<div class="edge"></div>
      <div class="scroll" data-scroll="settings"><div class="scr"><h1 class="large">הגדרות</h1>
        ${sec("שכר ומקום עבודה", row("מקום עבודה", PLACE) + row("שכר לשעה", `<span class="ltr num">${CUR} ${WAGE}</span>`))}
        ${sec("שעות תקן ליום", row("א׳–ד׳", `<span class="num">9:06</span>`) + row("ה׳", `<span class="num">8:06</span>`))}
        ${sec("נסיעות ותקופה", row("נסיעות ליום", `<span class="ltr num">${CUR} 22.60</span>`) + row("יום תחילת החודש", "1"))}
        ${sec("תצוגה", row("מראה", "כמו האייפון"))}
        ${sec("תזכורת לפי מיקום", row("מקום העבודה", PLACE) + row("טווח", "150 מ׳"))}
      </div></div><div class="home-ind"></div></div>`;
  }

  // ---- (proposals 2 to 4) the menus of a long press: what was pressed lifted, with what can be done to it ----
  const line = (a, b, c) => `<div><span>${a}</span><span class="num">${b}</span><span class="num"><span class="ltr">${c}</span></span></div>`;
  /** A shift lifted: its day and hours, its pay by rate, its break and its note. */
  function shiftPreview(e) {
    let lines;
    if (e.type === "work") {
      const regular = Math.min(e.net, e.std), extra = Math.max(0, e.net - e.std), a = Math.min(extra, 2), b = Math.max(0, extra - 2);
      lines = line(e.running ? "עבודה עד עכשיו" : "שעות רגילות", hm(regular), money(regular * WAGE))
        + (a > 0.01 ? line("נוספות 125%", hm(a), money(a * WAGE * 1.25)) : "") + (b > 0.01 ? line("נוספות 150%", hm(b), money(b * WAGE * 1.5)) : "")
        + (e.breakMin ? line("הפסקה", hm(e.breakMin / 60), "") : "");
    } else {
      lines = e.type === "vacation" ? line("חופשה בתשלום", hm(e.net), money(e.pay)) : line("יום מחלה ראשון", "0%", money(0));
    }
    const when = e.type !== "work" ? "" : e.end == null ? `מ־${clock(new Date(e.start))}` : range(e);
    return `<div class="pv"><div class="pv-head"><b>${dayLine(e.day)}</b><span class="num">${when}</span></div><div class="pv-lines">${lines}</div>
      ${e.note ? `<div class="pv-note">${e.note}</div>` : ""}<div class="pv-total"><span>${e.running ? "עד עכשיו" : "סה״כ"}</span><b class="num"><span class="ltr">${money(e.pay)}</span></b></div></div>`;
  }
  /** A day lifted: its shifts or its day off, or that it has none. */
  function dayPreview(date, entries) {
    const worked = entries.filter((e) => e.type === "work"), hours = worked.reduce((a, e) => a + e.net, 0);
    const lines = entries.map((e) => e.type !== "work" ? line(e.type === "vacation" ? "חופשה בתשלום" : "יום מחלה", "", money(e.pay))
      : line(e.end == null ? `מ־${clock(new Date(e.start))} · פעילה` : `<span class="num">${range(e)}</span>`, hm(e.net), money(e.pay))).join("");
    return `<div class="pv"><div class="pv-head"><b>${dayLine(date)}</b><span class="num">${worked.length ? hm(hours) + " שע׳" : ""}</span></div>
      ${entries.length ? `<div class="pv-lines">${lines}</div><div class="pv-total"><span>סה״כ</span><b class="num"><span class="ltr">${money(entries.reduce((a, e) => a + e.pay, 0))}</span></b></div>`
        : `<div class="pv-empty">אין משמרת ביום זה</div>`}</div>`;
  }
  /** What a long press on `key` opens: a preview (or the thing itself, lifted) and the menu's sections. */
  function menuFor(key) {
    const [kind, arg] = key.split(":"), s = shift();
    const item = (title, svg, more) => Object.assign({ title, svg }, more);
    const remove = (title) => ({ items: [item(title || "מחיקה", icon.trash, { red: true })] });
    if (kind === "shift") {
      const e = periodShifts(s)[+arg];
      if (!e) return null;
      const sections = e.type !== "work" ? [{ items: [item("עריכה", icon.pencil)] }, remove()]
        : [{ items: [item("עריכה", icon.pencil)].concat(e.running ? [] : [item("שכפול להיום", icon.dup)], [item("העתקת הסיכום", icon.copy)]) }, remove()];
      return { preview: shiftPreview(e), sections };
    }
    if (kind === "day") {
      const today = midnight(), date = new Date(today.getFullYear(), today.getMonth(), +arg), sum = byDay(periodShifts(s)).get(+arg);
      const entries = sum ? sum.entries : [];
      const sections = !entries.length ? [{ items: [item("הוספת משמרת", icon.plus), item("יום חופש", icon.sun), item("יום מחלה", icon.sick)] }]
        : sum.off ? [{ items: [item("עריכה", icon.pencil)] }, remove()]
        : [{ items: [item("פתיחת היום", icon.calendar)].concat(+date === +today ? [] : [item("שכפול להיום", icon.dup)]) }, remove(entries.length > 1 ? "מחיקת המשמרות" : "")];
      return { preview: dayPreview(date, entries), sections };
    }
    if (kind === "act") {
      // pressed too late: the moment it happened, a few minutes back, or another time
      const ago = (m) => item(m === 60 ? "לפני שעה" : `לפני ${m} דקות`, null, { sub: clock(new Date(s.now - m * 60000)) });
      const other = { items: [item("בשעה אחרת…", icon.clock)] };
      const sections = {
        start: [{ head: "התחלתי כבר", items: [ago(15), ago(30), ago(60)] }, other],
        brk: [{ head: "יצאתי להפסקה", items: [ago(10), ago(20), ago(30)] }],
        end: [{ head: "סיימתי כבר", items: [ago(15), ago(30)] }, other],
        back: [{ head: "חזרתי מההפסקה", items: [ago(5), ago(10)] }],
      }[arg];
      return sections ? { sections } : null;
    }
    if (kind === "plus") return { sections: [{ items: [item("משמרת", icon.timer), item("יום חופש", icon.sun), item("יום מחלה", icon.sick)] }] };
    return null;
  }

  // ---- the Live Activity, as built (Widget/ShiftLiveActivity.swift) ----
  const roundIcon = (svg, tint, size) => `<span class="ri" style="--tint:${tint};width:${size}px;height:${size}px">${sized(svg, Math.round(size * 0.36))}</span>`;
  function activityCard(s) {
    const onBreak = s.open != null;
    const tint = onBreak ? "var(--orange)" : "var(--accent)";
    const clockText = onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const head = onBreak ? `בהפסקה<span class="place">· עבדת ${timer(s.netMs)}</span>` : `במשמרת<span class="place">· ${PLACE}</span>`;
    const share = Math.min(1, s.net / GOAL_H);
    const goalText = s.remaining > 0 ? "יעד <span class=\"num\">" + clock(new Date(s.finish)) + "</span>" : "הגעת ליעד ✓";
    return `<div class="activity">
      <div class="a-top"><div class="a-left">
          <div class="a-head"><span class="dot" style="background:${tint}"></span>${head}</div>
          <div class="a-clock num" style="color:${tint}"><span class="ltr">${clockText}</span></div></div>
        <div class="a-btns">${roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", 50)}${roundIcon(icon.stop, "var(--red)", 50)}</div></div>
      <div class="a-bar"><i style="width:${share * 100}%;background:${tint}"></i></div>
      <div class="a-way"><span>התחלה <span class="num">${clock(new Date(s.start))}</span></span><span>${goalText}</span></div>
    </div>`;
  }

  const lockWall = (s) => `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}
    <div class="lock-date">${dayLine(new Date(s.now))}</div><div class="lock-clock">${clock(new Date(s.now))}</div>
    <div class="lock-buttons"><div>${icon.flash}</div><div>${icon.camera}</div></div><div class="home-ind" style="background:#fff"></div>`;

  function lockScreen() {
    const s = shift();
    if (!s.running) return lockWall(s) + `<div class="activity" style="align-items:center;color:var(--ink-2);font-size:14px">אין משמרת שרצה, ואין Live Activity</div>`;
    return lockWall(s) + activityCard(s);
  }

  // ---- the place: asked on arriving at work and on leaving it (proposed) ----
  function placeScreen() {
    const s = shift();
    const started = s.running ? clock(new Date(s.start)) : "07:15";
    const note = (title, text, time) => `<div class="notif"><span class="n-icon">${sized(icon.timer, 22)}</span>
      <div class="n-body"><div class="n-top"><b>${title}</b><span>${time}</span></div><div class="n-text">${text}</div></div></div>`;
    return lockWall(s) + `<div class="notes" style="top:226px;gap:8px">
      <div class="w-label">כשמגיעים לעבודה, בלחיצה ארוכה</div>
      ${note("הגעת ל" + PLACE, "להתחיל משמרת עכשיו?", "07:14")}
      <div class="n-actions"><div class="main">התחל משמרת</div><div>לא עכשיו</div></div>
      <div class="w-label" style="margin-top:10px">כשמגיעים ליעד</div>
      ${note("🎯 הגעת ליעד היומי", hm(GOAL_H) + " שעות · " + money(GOAL_H * WAGE) + " · מעכשיו שעות נוספות", "15:51")}
      <div class="w-label" style="margin-top:10px">כשיוצאים מהעבודה</div>
      ${note("יצאת מ" + PLACE, "המשמרת פתוחה מ־" + started + ". לסיים אותה?", "16:02")}
      <div class="n-actions"><div class="main" style="color:var(--red)">סיים משמרת</div><div>אני עדיין בעבודה</div></div>
    </div>`;
  }

  // ---- Siri's answers (Questions.swift), and the period's summary and the break's reminder (Alerts) ----
  function askScreen() {
    const s = shift();
    const today = s.running ? `היום עבדת ${spoken(s.net)} והרווחת ${moneyShort(s.pay)}. המשמרת עדיין פתוחה.`
      : `היום עבדת ${spoken(7.5)} והרווחת ${moneyShort(7.5 * WAGE)}.`;
    const goal = !s.running ? "אין משמרת פתוחה עכשיו."
      : s.remaining <= 0.001 ? "הגעת ליעד של היום. מעכשיו שעות נוספות."
      : s.open != null ? `בהפסקה עכשיו. נשארו ${spoken(s.remaining)} עד היעד.`
      : `נשארו ${spoken(s.remaining)} עד היעד, ב־<span class="num">${clock(new Date(s.finish))}</span>.`;
    const period = `בתקופה הזו עבדת ${spoken(112.5)} והרווחת ${moneyShort(6075.4)}. הצפי לסוף התקופה: ${moneyShort(NET.gross)} ברוטו, בערך ${moneyShort(NET.net)} נטו.`;
    const answer = (asked, text) => `<div class="w-label">״${asked}״</div>
      <div class="siri"><span class="mini-icon">${appIcon[dark() ? "dark" : "light"]}</span><div class="n-body"><div class="s-app">Shifty</div><div class="s-text">${text}</div></div></div>`;
    const note = (title, text, time) => `<div class="notif"><span class="mini-icon">${appIcon[dark() ? "dark" : "light"]}</span>
      <div class="n-body"><div class="n-top"><b>${title}</b><span>${time}</span></div><div class="n-text">${text}</div></div></div>`;
    // over the home screen, as Siri answers anywhere
    return `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}<div class="home-ind" style="background:#fff"></div>
      <div class="notes" style="top:64px;gap:7px">
      ${answer("כמה הרווחתי היום ב-Shifty?", today)}
      ${answer("כמה נשאר ליעד ב-Shifty?", goal)}
      ${answer("כמה עבדתי החודש ב-Shifty?", period)}
      <div class="w-label" style="margin-top:8px">בבוקר שאחרי סוף התקופה</div>
      ${note("סיכום אוקטובר 2026", `<span class="num">152:10</span> שעות · ${moneyShort(NET.gross)} ברוטו · כ־${moneyShort(NET.net)} נטו`, "09:00")}
      <div class="w-label" style="margin-top:8px">אחרי 6 שעות בלי הפסקה, בלחיצה ארוכה</div>
      ${note("⏸️ שש שעות ברצף", "זה זמן טוב לעצור להפסקה.", "13:15")}
      <div class="n-actions"><div class="main" style="color:var(--orange)">התחל הפסקה</div></div>
    </div>`;
  }

  // ---- the home screen's icon: light, dark, and tinted in the color picked on the iPhone ----
  function iconScreen() {
    const s = shift();
    const band = (look, title, wall) => `<div class="icon-band"><div class="wall ${wall}"></div><span class="look">${title}</span>
      <span class="big">${appIcon[look]}</span><span class="name">Shifty</span></div>`;
    return `<div class="wall dark-wall"></div>${statusBar(s.now, true)}<div class="icon-rows">
      ${band("light", "בהיר", "")}${band("dark", "כהה", "dark-wall")}${band("tinted", "צבוע", "dark-wall")}
    </div><div class="home-ind" style="background:#fff"></div>`;
  }

  function islandScreen() {
    const s = shift();
    const wall = `<div class="wall dark-wall"></div>${statusBar(s.now, true)}`;
    if (!s.running) return wall + `<div class="widgets" style="top:120px"><div class="w-label" style="font-size:14px">אין משמרת שרצה</div></div>`;
    const onBreak = s.open != null, tint = onBreak ? "var(--orange)" : "var(--accent)";
    const t = onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const share = Math.min(1, s.net / GOAL_H);
    return wall + `
      <div class="di di-compact" style="color:${tint}"><span style="width:18px;height:18px;display:block">${onBreak ? icon.pause : icon.timer}</span><span class="num" style="font-size:14px;font-weight:600;width:64px;text-align:center"><span class="ltr">${t}</span></span></div>
      <div class="widgets" style="top:70px"><div class="w-label">מצומצם: הסמל מימין, והשעון משמאל ברוחב שלם</div></div>
      <div class="di di-expanded" style="top:150px">
        <div class="di-row"><span style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:${tint}"></span>${onBreak ? "בהפסקה" : "במשמרת"}</span>
          <span class="num" style="font-size:26px;font-weight:600;color:${tint}"><span class="ltr">${t}</span></span></div>
        <div style="display:flex;align-items:center;gap:14px"><div style="flex:1;display:flex;flex-direction:column;gap:6px">
            <div class="a-bar" style="background:rgba(255,255,255,.14)"><i style="width:${share * 100}%;background:${tint}"></i></div>
            <div class="a-way" style="margin:0;color:rgba(255,255,255,.6)"><span>התחלה <span class="num">${clock(new Date(s.start))}</span></span><span>יעד <span class="num">${clock(new Date(s.finish))}</span></span></div></div>
          <div class="a-btns">${roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", 42)}${roundIcon(icon.stop, "var(--red)", 42)}</div></div>
      </div>
      <div class="widgets" style="top:330px"><div class="w-label">פתוח, בלחיצה ארוכה</div></div>`;
  }

  function widgetsScreen() {
    const s = shift();
    const running = s.running, onBreak = running && s.open != null;
    const tint = !running ? "var(--ink)" : onBreak ? "var(--orange)" : "var(--accent)";
    const title = !running ? "היום" : onBreak ? "בהפסקה" : "במשמרת";
    const dot = !running ? "var(--ink-3)" : onBreak ? "var(--orange)" : "var(--green)";
    const t = !running ? "7:30" : onBreak ? timer(s.now - s.open) : timer(s.netMs);
    const share = running ? Math.min(1, s.net / GOAL_H) : 7.5 / GOAL_H;
    const wayEnd = !running ? "יעד " + hm(GOAL_H) : s.remaining > 0 ? "יעד " + clock(new Date(s.finish)) : "הגעת ליעד ✓";
    const wayStart = !running ? money(7.5 * WAGE) : "התחלה " + clock(new Date(s.start));
    const btns = (size) => running
      ? roundIcon(onBreak ? icon.play : icon.pause, onBreak ? "var(--accent)" : "var(--orange)", size) + roundIcon(icon.stop, "var(--red)", size)
      : roundIcon(icon.play, "var(--accent)", size);
    const bar = `<div class="a-bar"><i style="width:${share * 100}%;background:${onBreak ? "var(--orange)" : "var(--accent)"}"></i></div>`;
    return `<div class="wall ${dark() ? "dark-wall" : ""}"></div>${statusBar(s.now, true)}
      <div class="widgets">
        <div><div class="w w-small">
          <div class="w-head"><span class="dot" style="background:${dot}"></span>${title}</div>
          <div style="flex:1"></div>
          <div class="w-clock num" style="font-size:34px;color:${tint}"><span class="ltr">${t}</span></div>
          <div style="margin-top:8px">${bar}</div>
          <div style="flex:1"></div>
          <div style="display:flex;align-items:center;gap:8px">${btns(36)}<span style="flex:1"></span><span class="num" style="font-size:11px;font-weight:600;color:var(--ink-2)">${wayEnd}</span></div>
        </div><div class="w-label" style="margin-top:6px">קטן</div></div>
        <div><div class="w w-medium">
          <div style="flex:1;display:flex;flex-direction:column;height:100%">
            <div class="w-head"><span class="dot" style="background:${dot}"></span>${title}</div>
            <div style="flex:1"></div>
            <div class="w-clock num" style="font-size:40px;color:${tint}"><span class="ltr">${t}</span></div>
            <div style="flex:1"></div>${bar}
            <div class="a-way" style="margin-top:6px;font-size:11px"><span>${wayStart}</span><span>${wayEnd}</span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">${btns(48)}</div>
        </div><div class="w-label" style="margin-top:6px">בינוני</div></div>
      </div><div class="home-ind" style="background:#fff"></div>`;
  }

  // ---- the page ----
  const notes = {
    lock: '<span class="tag built">כמו שבבנייה</span>מסך הנעילה, עם הרקע שמתחלף לכהה יחד עם האייפון.',
    island: '<span class="tag built">אחרי התיקון</span>השעון ב-Dynamic Island ברוחב שמספיק לשעות, דקות ושניות.',
    widgets: '<span class="tag built">כמו שבבנייה</span>הווידג\'טים למסך הבית.',
    place: '<span class="tag built">כמו שבבנייה</span>ההתראות מגיעות גם כשהאפליקציה סגורה. כשמגיעים לעבודה וכשיוצאים ממנה, לפי מקום העבודה שנקבע בהגדרות. כשמגיעים ליעד, לפי שעה שנקבעת מראש.',
    ask: '<span class="tag built">כמו שבבנייה</span>Siri עונה בלי לפתוח את Shifty. מתחת: הסיכום שמגיע בבוקר שאחרי סוף התקופה, והתזכורת אחרי 6 שעות בלי הפסקה, עם כפתור להפסקה. כל אחד מהם נכבה בהגדרות.',
    icon: '<span class="tag built">כמו שבבנייה</span>הסמל של Shifty במסך הבית: בהיר, כהה, וצבוע בגוון שבוחרים באייפון.',
  };
  // the app's tabs, and the proposals to try on each (none of them built yet)
  const appNotes = {
    now: '<span class="tag">הצעה 1</span>במעבר בין הלשוניות, לכל אייקון בסרגל תנועה משלו.<br><span class="tag">הצעה 3</span>לחיצה ארוכה על כפתורי המשמרת, למי ששכח ללחוץ בזמן.<br><span class="tag">הצעה 4</span>לחיצה ארוכה על הפלוס, במצב "לא במשמרת".',
    shifts: '<span class="tag">הצעה 2</span>לחיצה ארוכה על משמרת: הפירוט שלה ותפריט.<br><span class="tag">הצעה 4</span>לחיצה ארוכה על הפלוס למעלה.<br><span class="tag">הצעה 5</span>בזמן משמרת, השעון מעל הסרגל. בגלילה למטה הסרגל מתכווץ והשעון עובר לצדו.',
    calendar: '<span class="tag">הצעה 2</span>לחיצה ארוכה על יום: הפירוט שלו ותפריט. ביום ריק: משמרת, חופש או מחלה.<br><span class="tag">הצעה 5</span>בזמן משמרת, השעון מעל הסרגל.',
    settings: '<span class="tag">הצעה 5</span>בזמן משמרת, השעון מעל הסרגל, ולחיצה עליו חוזרת ל"עכשיו". ההגדרות כאן מקוצרות.',
  };
  const device = document.getElementById("device"), stage = document.getElementById("stage");
  const view = document.getElementById("view"), chrome = document.getElementById("chrome"), layer = document.getElementById("layer");
  const dark = () => state.theme === "dark" || (state.theme == null && matchMedia("(prefers-color-scheme: dark)").matches);
  let scale = 1;

  // ---- the tab bar, built once: its lens slides to the tab chosen, and that tab's symbol moves (proposal 1) ----
  const tabIcons = { now: icon.timer, shifts: icon.list, calendar: icon.calendar, settings: icon.gear };
  const tabNames = { now: "עכשיו", shifts: "משמרות", calendar: "לוח", settings: "הגדרות" };
  const tabFx = { now: "bounce", shifts: "layers", calendar: "wiggle", settings: "rotate" };
  chrome.innerHTML = `<div class="acc glass"><button class="acc-main" type="button" data-acc></button><button class="acc-btn" type="button" data-acc-toggle></button></div>
    <nav class="tabs glass"><span class="lens"></span>${TABS.map((t) => `<button class="t" type="button" data-tab="${t}" data-fx="${tabFx[t]}">${tabIcons[t]}<span>${tabNames[t]}</span></button>`).join("")}</nav>
    <button class="tab-mini glass" type="button" data-expand aria-label="הצגת הלשוניות"></button>`;
  const replay = (el, name) => { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); };
  function switchTab(tab) {
    if (tab === state.tab) return;
    state.tab = tab;
    state.plan = null;
    state.sheet = null;
    closeMenu();
    replay(chrome.querySelector(".lens"), "moving");
    replay(chrome.querySelector(`[data-tab="${tab}"]`), "fx");
    save(); render();
  }
  /** The tab bar on the app's screens, and the running shift over it on the tabs other than Now (proposal 5). */
  function updateChrome() {
    const app = state.screen === "now", s = shift(), acc = app && s.running && state.tab !== "now";
    chrome.hidden = !app;
    device.classList.toggle("mini", app && mini);
    device.classList.toggle("has-acc", acc);
    if (!app) return;
    chrome.style.setProperty("--i", TABS.indexOf(state.tab));
    for (const b of chrome.querySelectorAll("[data-tab]")) b.classList.toggle("on", b.dataset.tab === state.tab);
    const small = chrome.querySelector(".tab-mini");
    if (small.dataset.shows !== state.tab) { small.dataset.shows = state.tab; small.innerHTML = tabIcons[state.tab]; }
    if (!acc) return;
    const onBreak = s.open != null, button = chrome.querySelector(".acc-btn");
    chrome.querySelector(".acc-main").innerHTML = `<span class="acc-dot pulse" style="background:${onBreak ? "var(--orange)" : "var(--green)"}"></span>
      <b class="acc-clock num"><span class="ltr">${onBreak ? timer(s.now - s.open) : timer(s.netMs)}</span></b><span class="acc-label">${onBreak ? "בהפסקה" : "במשמרת"}</span>
      <span class="acc-pay num"><span class="ltr">${money(s.pay)}</span></span>`;
    button.style.setProperty("--tint", onBreak ? "var(--accent)" : "var(--orange)");
    button.innerHTML = onBreak ? icon.play : icon.pause;
    button.setAttribute("aria-label", onBreak ? "חזרה לעבודה" : "הפסקה");
  }

  // ---- the screen, drawn again each second: each tab keeps its scroll, and it waits while a finger scrolls, drags or holds ----
  let touched = 0, dragging = false, frame = 0, mini = false, lastY = 0, restored = null;
  const scrolls = {};
  const touch = () => { touched = Date.now(); };
  document.addEventListener("touchmove", touch, { passive: true });
  // scrolling down shrinks the tab bar to its tab, and scrolling up brings it back
  document.addEventListener("scroll", (e) => {
    const el = e.target;
    if (!(el instanceof Element) || !el.classList.contains("scroll")) return;
    if (restored && el === restored.el && el.scrollTop === restored.top) return;   // its place, given back after drawing
    restored = null;
    touch();
    const y = el.scrollTop, dy = y - lastY;
    lastY = y;
    if (y < 24 || dy < -4) setMini(false);
    else if (dy > 4) setMini(true);
  }, true);
  function setMini(on) {
    if (mini === on) return;
    mini = on;
    device.classList.toggle("mini", state.screen === "now" && on);
  }
  function render() {
    const old = view.querySelector(".scroll");
    if (old) scrolls[old.dataset.scroll] = old.scrollTop;
    view.innerHTML = state.screen === "now"
      ? { now: nowScreen, shifts: shiftsScreen, calendar: calendarScreen, settings: settingsScreen }[state.tab]()
      : { lock: lockScreen, island: islandScreen, widgets: widgetsScreen, place: placeScreen, ask: askScreen, icon: iconScreen }[state.screen]();
    const again = view.querySelector(".scroll");
    if (again) {
      again.scrollTop = scrolls[again.dataset.scroll] || 0;
      restored = { el: again, top: again.scrollTop };
      lastY = again.scrollTop;
    }
    updateChrome();
    document.getElementById("note").innerHTML = state.screen === "now" ? appNotes[state.tab] : notes[state.screen];
    for (const b of document.querySelectorAll("[data-screen]")) b.setAttribute("aria-pressed", String(b.dataset.screen === state.screen));
    for (const b of document.querySelectorAll("[data-state]")) b.setAttribute("aria-pressed", String(b.dataset.state === state.state));
    for (const b of document.querySelectorAll("[data-theme-set]")) b.setAttribute("aria-pressed", String(b.dataset.themeSet === (dark() ? "dark" : "light")));
  }

  // dragging the flag along the dial: the time is the angle's on the twelve hours after the start, by five minutes
  function dragTo(x, y) {
    const el = device.querySelector(".dial"), s = shift();
    if (!el || !s.running) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let deg = Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    const after = ((deg - clockDeg(s.start)) % 360 + 360) % 360;
    let end = s.start + after / 30 * 3600000;
    end = Math.round(end / 300000) * 300000;
    state.plan = Math.max(s.now, end);
    touch();
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); });
  }
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".dial .goal")) return;
    dragging = true;
    e.preventDefault();
    dragTo(e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", (e) => { if (dragging) { e.preventDefault(); dragTo(e.clientX, e.clientY); } });
  document.addEventListener("pointerup", () => { dragging = false; });
  document.addEventListener("pointercancel", () => { dragging = false; });

  // ---- a long press (proposals 2 to 4): what was pressed shrinks a little, then lifts with its menu ----
  let press = null, suppress = 0;
  device.addEventListener("pointerdown", (e) => {
    const el = e.target.closest("[data-menu]");
    if (!el || state.menu || e.button > 0) return;
    touch();
    el.classList.add("pressing");
    press = { el, x: e.clientX, y: e.clientY, opened: false };
    press.timer = setTimeout(() => { if (!press) return; press.opened = true; el.classList.remove("pressing"); openMenu(el); }, 480);
  });
  function release() {
    if (!press) return;
    clearTimeout(press.timer);
    press.el.classList.remove("pressing");
    if (press.opened) suppress = Date.now() + 400;   // the lifting of the finger is not a tap on the menu
    press = null;
  }
  device.addEventListener("pointermove", (e) => { if (press && !press.opened && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) release(); });
  device.addEventListener("pointerup", release);
  device.addEventListener("pointercancel", release);
  device.addEventListener("contextmenu", (e) => {
    const el = e.target.closest("[data-menu]");
    if (!el) return;
    e.preventDefault();
    if (press) { clearTimeout(press.timer); press.el.classList.remove("pressing"); press = null; }
    if (!state.menu) { openMenu(el); suppress = Date.now() + 400; }
  });
  function openMenu(el) {
    const def = menuFor(el.dataset.menu);
    if (!def) return;
    const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
    const box = { top: (r.top - d.top) / scale, left: (r.left - d.left) / scale, width: r.width / scale, height: r.height / scale };
    const sections = def.sections.map((sec) => `<div class="cm-sec">${sec.head ? `<div class="cm-head">${sec.head}</div>` : ""}${sec.items.map((it) =>
      `<button class="cm-item${it.red ? " red" : ""}" type="button" data-cm-close><span>${it.title}${it.sub ? `<small class="num">${it.sub}</small>` : ""}</span>${it.svg || ""}</button>`).join("")}</div>`).join("");
    const lifted = def.preview ? `<div class="cm-preview cm-card">${def.preview}</div>`
      : `<div class="cm-preview cm-src">${el.outerHTML.replace(/ data-menu="[^"]*"/, "").replace(" pressing", "")}</div>`;
    layer.innerHTML = `<div class="cm"><button class="cm-dim" type="button" data-cm-close aria-label="סגירה"></button>${lifted}<div class="cm-menu" role="menu">${sections}</div></div>`;
    state.menu = el.dataset.menu;
    // a shift or a day lifted where it was, its menu under it; a button where it is, its menu over it when it is low on the
    // screen, on the button's side
    const pv = layer.querySelector(".cm-preview"), menu = layer.querySelector(".cm-menu");
    const H = 874, top = 60, bottom = H - 34, gap = 10, mh = menu.offsetHeight;
    if (def.preview) {
      const ph = pv.offsetHeight, y = Math.min(Math.max(top, box.top), Math.max(top, bottom - ph - gap - mh));
      pv.style.top = y + "px";
      menu.style.top = y + ph + gap + "px";
      menu.style.right = "16px";
      menu.style.transformOrigin = "top right";
    } else {
      Object.assign(pv.style, { top: box.top + "px", left: box.left + "px", width: box.width + "px", height: box.height + "px" });
      const above = box.top + box.height / 2 > H / 2, right = box.left + box.width / 2 > 201;
      menu.style.top = Math.min(Math.max(top, above ? box.top - gap - mh : box.top + box.height + gap), bottom - mh) + "px";
      if (right) menu.style.right = 402 - box.left - box.width + "px";
      else menu.style.left = box.left + "px";
      menu.style.transformOrigin = (above ? "bottom " : "top ") + (right ? "right" : "left");
    }
  }
  function closeMenu() {
    state.menu = null;
    layer.innerHTML = "";
  }

  function fit() {
    scale = Math.max(0.5, Math.min(document.documentElement.clientWidth - 32, 402) / 402);
    stage.style.setProperty("--s", String(scale));
    device.style.setProperty("--s", String(scale));
  }
  function save() {
    try { localStorage.setItem("shifty-preview", JSON.stringify({ screen: state.screen, state: state.state, theme: state.theme, tab: state.tab })); } catch (e) {}
  }

  document.addEventListener("click", (e) => {
    if (Date.now() < suppress) return;
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) return switchTab(b.dataset.tab);
    if ("expand" in b.dataset) return setMini(false);
    if ("cmClose" in b.dataset) return closeMenu();
    if ("acc" in b.dataset) { setMini(false); return switchTab("now"); }
    if ("accToggle" in b.dataset) state.state = state.state === "break" ? "work" : "break";
    else if (b.dataset.reset) state.plan = null;
    else if ("sheet" in b.dataset) state.sheet = b.dataset.sheet || null;
    else if (b.dataset.screen) { state.screen = b.dataset.screen; state.plan = null; state.sheet = null; closeMenu(); setMini(false); }
    else if (b.dataset.state) { state.state = b.dataset.state; state.plan = null; state.sheet = null; closeMenu(); }
    else if (b.dataset.themeSet) { state.theme = b.dataset.themeSet; document.documentElement.dataset.theme = state.theme; }
    else return;
    save(); render();
  });
  if (state.theme) document.documentElement.dataset.theme = state.theme;
  document.documentElement.lang = "he";
  addEventListener("resize", fit);
  fit(); render();
  setInterval(() => { if (!dragging && !press && Date.now() - touched > 1200) render(); }, 1000);
})();
</script>

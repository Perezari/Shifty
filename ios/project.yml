# The native iPhone app (ios/README.md). The Xcode project and the Info.plists are generated on the
# build Mac with XcodeGen (`xcodegen generate`) and not kept in git.
name: Shifty
options:
  bundleIdPrefix: com.perezari
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: he
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Shifty:
    type: application
    platform: iOS
    sources:
      - path: Shifty
    info:
      path: Shifty/Info.plist
      properties:
        CFBundleDisplayName: Shifty
        # XcodeGen would write "1.0" and "1"; the TestFlight build sets the build number to its time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        # The lock (Lock.swift).
        NSFaceIDUsageDescription: Shifty משתמשת ב-Face ID כדי להיפתח כשהנעילה פועלת.
        # The running shift on the Lock Screen and in the Dynamic Island (Live/LiveShift.swift).
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: Background
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.perezari.shifty
            CFBundleURLSchemes: [shifty]
    # The App Group the widgets and the Live Activity share the shifts through, and iCloud's key-value
    # store for the shifts on the user's other devices (ICloud.swift). The App IDs com.perezari.shifty and
    # com.perezari.shifty.widget have the App Groups capability with the group; the app's also has iCloud
    # (no CloudKit container).
    entitlements:
      path: Shifty/Shifty.entitlements
      properties:
        com.apple.security.application-groups: [group.com.perezari.shifty]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perezari.shifty
        # The iPhone alone. Set on each target: XcodeGen's preset for iOS targets ('1,2', iPhone and
        # iPad) outweighs the project's setting, and App Store Connect then asks for iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # The intents' work in the app alone (Live/ShiftIntents.swift); the widget extension has them too.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHIFTY_APP"
    dependencies:
      - target: ShiftyWidget
  # The shift's widget, its Live Activity and its switch in the Control Center (Widget/), with the app's
  # engine and store to read the shifts from the App Group, and the intents for their buttons.
  ShiftyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shifty/Core/Calc.swift
      - path: Shifty/Core/Format.swift
      - path: Shifty/Core/Holidays.swift
      - path: Shifty/Core/LocalTime.swift
      - path: Shifty/Core/Models.swift
      - path: Shifty/Core/Now.swift
      - path: Shifty/Core/ShiftStore.swift
      - path: Shifty/Live/ShiftActivity.swift
      - path: Shifty/Live/ShiftIntents.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Shifty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ShiftyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.perezari.shifty]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perezari.shifty.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
schemes:
  Shifty:
    build:
      targets:
        Shifty: all
    run:
      config: Debug
    archive:
      config: Release

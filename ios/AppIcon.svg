<!-- The iPhone app's icon (ios/Shifty/Assets.xcassets/AppIcon.appiconset/AppIcon.png, 1024 px), since 1.5:
     the shekel sign, two interlocking strokes, inside a clock's twelve ticks, in the app's color on white.
     iOS draws its rounded corners. Drawn by the scratch script that also renders the PNGs; the same
     picture, without the sign's shadow, is LaunchShekel and Views/Opening.swift's first frame. -->
<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#e3edeb"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
<stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a3f3a" flood-opacity="0.18"/>
</filter>
<linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1ec6b4"/>
<stop offset="1" stop-color="#0a786d"/>
</linearGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#sheen)"/>
<line x1="256" y1="88" x2="256" y2="52" stroke="#0f9d8f" stroke-opacity="0.9" stroke-width="15" stroke-linecap="round"/>

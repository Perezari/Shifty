<line x1="100.12" y1="166" x2="79.33" y2="154" stroke="#0f9d8f" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>
<line x1="166" y1="100.12" x2="154" y2="79.33" stroke="#0f9d8f" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>

<line x1="411.88" y1="346" x2="432.67" y2="358" stroke="#0f9d8f" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>
<line x1="346" y1="411.88" x2="358" y2="432.67" stroke="#0f9d8f" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>

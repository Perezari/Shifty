<!-- The icon in the iPhone's dark look (AppIcon.appiconset/AppIcon-dark.png, 1024 px), and the alternate
     "כהה" (AppIcon-Dark.appiconset, Settings › אייקון): AppIcon.svg's ticks and sign in the app's
     color, brighter, on the near black of iOS's own dark icons. -->

<!-- The icon in the iPhone's dark look (ios/Shifty/Assets.xcassets/AppIcon.appiconset/AppIcon-dark.png,
     1024 px): AppIcon.svg's ring and start mark in the app's color, on the near black of iOS's own dark
     icons. -->
<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202427"/>
      <stop offset="1" stop-color="#0b0c0d"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d6c4"/>
      <stop offset="1" stop-color="#14a898"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- progress ring -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#1bb3a3" stroke-opacity="0.26" stroke-width="34"/>
  <path d="M256 118 a138 138 0 0 1 119.5 207" fill="none" stroke="#25c4b3" stroke-width="34" stroke-linecap="round"/>
  <!-- play / start mark -->
  <path d="M228 206 l78 50 -78 50 z" fill="url(#fg)"/>
</svg>
